
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRENADIERS LINEUP PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --haiti-blue: #00209F; 
            --haiti-red: #D21034;
            --pitch-green: #2e7d32; 
            --accent: #FFD700; /* Gold accents for winners */
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            margin: 0; background: #050505; color: white; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
            touch-action: none; overscroll-behavior: none;
        }

        /* --- HAITIAN PRO HEADER --- */
        #app-header {
            background: linear-gradient(90deg, var(--haiti-blue) 50%, var(--haiti-red) 50%);
            padding: 12px 15px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 3px solid var(--accent); z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #team-crest-box {
            width: 55px; height: 55px; border: 2px solid white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: white; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        #team-crest-box img { width: 85%; height: 85%; object-fit: contain; }
        #app-header h1 { 
            margin: 0; font-size: 16px; color: white; flex: 1; text-align: center; 
            text-transform: uppercase; font-weight: 900; letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* --- 3D ARENA --- */
        #stage {
            flex: 1; perspective: 1200px; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden; padding-bottom: 20px;
        }

        #pitch {
            width: 92%; height: 52vh;
            background-color: var(--pitch-green);
            background-image: repeating-linear-gradient(0deg, #388e3c, #388e3c 10%, #2e7d32 10%, #2e7d32 20%);
            position: relative; border: 3px solid rgba(255,255,255,0.9);
            transform: rotateX(20deg); transform-style: preserve-3d;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
        }

        .line { position: absolute; border: 1.5px solid rgba(255,255,255,0.8); pointer-events: none; }
        .halfway { top: 50%; width: 100%; border-bottom: 2px solid white; transform: translateY(-50%); }
        .center-circle { top: 50%; left: 50%; width: 90px; height: 90px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box { left: 15%; width: 70%; height: 18%; border: 2px solid white; }
        .penalty-box.top { top: 0; border-top: none; }
        .penalty-box.bottom { bottom: 0; border-bottom: none; }

        /* --- PLAYER STYLING --- */
        .player { 
            position: absolute; width: 65px; text-align: center; 
            z-index: 500; cursor: grab;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.4s ease, left 0.4s ease;
            will-change: transform; touch-action: none;
        }

        .player.is-dragging {
            transition: none; transform: scale(1.3) !important;
            z-index: 2000; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
        }

        .jersey {
            width: 50px; height: 50px; background-color: var(--haiti-blue); border: 3px solid white;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: 900; font-size: 18px; color: white;
            background-size: cover; background-position: center; position: relative;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .name-label { 
            font-size: 11px; font-weight: 800; margin-top: 6px; 
            background: rgba(0,0,0,0.8); color: white; padding: 2px 8px; 
            border-radius: 10px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2);
        }

        /* --- SMART DOCK (CONTROLS) --- */
        #dock {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px; border-top: 1px solid #333;
            display: flex; flex-direction: column; gap: 10px;
        }
        
        #bench { 
            height: 80px; display: flex; align-items: center; gap: 15px;
            overflow-x: auto; padding: 0 10px; background: rgba(0,0,0,0.3);
            border-radius: 15px; border: 1px solid #444;
        }

        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        
        button, select { 
            padding: 12px 5px; border: none; border-radius: 10px; 
            font-weight: bold; color: white; background: #333; 
            font-size: 10px; text-transform: uppercase; cursor: pointer;
        }

        .btn-haiti { background: var(--haiti-blue); border-bottom: 3px solid #00156b; }
        .btn-action { background: var(--haiti-red); border-bottom: 3px solid #9b0b26; }
        .export-btn { 
            grid-column: span 4; background: var(--accent); color: black; 
            font-size: 14px; margin-top: 5px; padding: 15px;
        }

        /* --- MODAL --- */
        #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; backdrop-filter: blur(8px); }
        #edit-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; padding: 25px; border-radius: 25px; width: 85%; z-index: 3001; 
            border: 2px solid var(--haiti-blue);
        }
        input, select { width: 100%; padding: 14px; background: #252525; border: 1px solid #444; color: white; border-radius: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="app-header">
    <div id="team-crest-box" onclick="document.getElementById('crestIn').click()">
        <img id="crestPrev" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f4/Coat_of_arms_of_Haiti.svg/1200px-Coat_of_arms_of_Haiti.svg.png">
    </div>
    <input type="file" id="crestIn" hidden accept="image/*" onchange="loadCrest(this)">
    <h1>GRENADIERS HAÏTI</h1>
    <button class="btn-haiti" onclick="saveData()" style="padding: 8px 15px;">SAVE</button>
</div>

<div id="stage">
    <div id="pitch">
        <div class="line halfway"></div>
        <div class="line center-circle"></div>
        <div class="line penalty-box top"></div>
        <div class="line penalty-box bottom"></div>
    </div>
</div>

<div id="dock">
    <div id="bench"></div>
    <div class="btn-group">
        <button class="btn-haiti" onclick="addNewBenchPlayer()">+ JOUEUR</button>
        <select onchange="changeFormation(this.value)">
            <option value="442">4-4-2</option>
            <option value="433">4-3-3</option>
            <option value="352">3-5-2</option>
        </select>
        <button onclick="loadData()">LOAD</button>
        <button class="btn-action" onclick="location.reload()">CLEAR</button>
        <button class="export-btn" onclick="exportImage()">📸 EXPORTER L'ALBUM PHOTO</button>
    </div>
</div>

<div id="modal-overlay" onclick="closeModal()"></div>
<div id="edit-modal">
    <h3 style="margin:0 0 20px 0; color:var(--haiti-blue); text-align:center;">MODIFIER JOUEUR</h3>
    <input type="text" id="pName" placeholder="Nom du joueur">
    <input type="number" id="pNum" placeholder="Numéro">
    <div style="display:flex; gap:10px;">
        <input type="color" id="pColor" value="#00209F" style="height:50px; width:80px;">
        <select id="pPattern">
            <option value="">Uni</option>
            <option value="striped">Rayé</option>
            <option value="hooped">Cerclé</option>
        </select>
    </div>
    <input type="file" id="pImg" accept="image/*">
    <div style="display:flex; gap:10px;">
        <button class="btn-haiti" style="flex:2; padding:15px" onclick="applyPlayerChanges()">APPLIQUER</button>
        <button style="background:#444; flex:1" onclick="closeModal()">RETOUR</button>
    </div>
</div>

<script>
    let activePlayer = null;
    let isDragging = false;
    let startX, startY;
    let lastTap = 0;

    const initialPlayers = [
        {y:88, x:43, n:'GK', num:1, c:'#ffd600'},
        {y:72, x:10}, {y:75, x:32}, {y:75, x:53}, {y:72, x:75},
        {y:48, x:22}, {y:50, x:43}, {y:48, x:64},
        {y:20, x:15}, {y:12, x:43}, {y:20, x:72}
    ];

    function createPlayer(data, parent) {
        const p = document.createElement('div');
        p.className = 'player';
        if(parent.id === 'pitch') {
            p.style.top = data.y + '%';
            p.style.left = data.x + '%';
        } else {
            p.style.position = 'static';
            p.style.transform = 'scale(0.85)';
        }

        p.innerHTML = `
            <div class="jersey" style="background-color:${data.c || '#00209F'}">
                <div class="pattern"></div>
                <span class="num-txt">${data.num || '?'}</span>
            </div>
            <div class="name-label">${data.n || 'JOUEUR'}</div>
        `;
        
        p.addEventListener('pointerdown', handlePointerDown);
        // Pure App Feature: Double tap to remove
        p.addEventListener('click', function(e) {
            let now = new Date().getTime();
            if (now - lastTap < 300) {
                if(confirm("Supprimer ce joueur?")) p.remove();
            }
            lastTap = now;
        });
        
        parent.appendChild(p);
    }

    function handlePointerDown(e) {
        activePlayer = e.currentTarget;
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        activePlayer.setPointerCapture(e.pointerId);
    }

    function handlePointerMove(e) {
        if (!activePlayer) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            isDragging = true;
            activePlayer.classList.add('is-dragging');
            activePlayer.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(1.3)`;
        }
    }

    function handlePointerUp(e) {
        if (!activePlayer) return;
        window.removeEventListener('pointermove', handlePointerMove);
        window.removeEventListener('pointerup', handlePointerUp);

        if (!isDragging) {
            openModal(activePlayer);
        } else {
            const bench = document.getElementById('bench');
            const pitch = document.getElementById('pitch');
            const bRect = bench.getBoundingClientRect();
            activePlayer.classList.remove('is-dragging');

            if (e.clientY > bRect.top) {
                bench.appendChild(activePlayer);
                activePlayer.style.position = 'static';
                activePlayer.style.transform = 'scale(0.85)';
            } else {
                pitch.appendChild(activePlayer);
                activePlayer.style.position = 'absolute';
                const pRect = pitch.getBoundingClientRect();
                activePlayer.style.left = Math.max(0, Math.min(92, ((e.clientX - pRect.left - 30) / pRect.width) * 100)) + '%';
                activePlayer.style.top = Math.max(0, Math.min(92, ((e.clientY - pRect.top - 30) / pRect.height) * 100)) + '%';
                activePlayer.style.transform = 'none';
            }
        }
        activePlayer = null;
    }

    function addNewBenchPlayer() { createPlayer({n: 'NOUVEAU', num: 12}, document.getElementById('bench')); }

    function openModal(el) {
        activePlayer = el;
        document.getElementById('pName').value = el.querySelector('.name-label').innerText;
        document.getElementById('pNum').value = el.querySelector('.num-txt').innerText;
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('edit-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('edit-modal').style.display = 'none';
    }

    function applyPlayerChanges() {
        const jersey = activePlayer.querySelector('.jersey');
        activePlayer.querySelector('.name-label').innerText = document.getElementById('pName').value;
        jersey.querySelector('.num-txt').innerText = document.getElementById('pNum').value;
        jersey.style.backgroundColor = document.getElementById('pColor').value;
        const file = document.getElementById('pImg').files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = (e) => jersey.style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(file);
        }
        closeModal();
    }

    function changeFormation(val) {
        const ps = document.querySelectorAll('.player');
        const pitch = document.getElementById('pitch');
        let c = [];
        if(val==='442') c=[{y:88,x:43},{y:72,x:10},{y:75,x:32},{y:75,x:53},{y:72,x:75},{y:50,x:10},{y:52,x:35},{y:52,x:52},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        if(val==='433') c=[{y:88,x:43},{y:72,x:10},{y:75,x:32},{y:75,x:53},{y:72,x:75},{y:52,x:22},{y:55,x:43},{y:52,x:64},{y:22,x:15},{y:15,x:43},{y:22,x:72}];
        if(val==='352') c=[{y:88,x:43},{y:75,x:22},{y:78,x:43},{y:75,x:64},{y:50,x:10},{y:52,x:28},{y:55,x:43},{y:52,x:58},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        c.forEach((pos, i) => {
            if(ps[i]) {
                pitch.appendChild(ps[i]);
                ps[i].style.position = 'absolute';
                ps[i].style.top = pos.y + '%';
                ps[i].style.left = pos.x + '%';
                ps[i].style.transform = 'none';
            }
        });
    }

    function exportImage() {
        html2canvas(document.getElementById('stage')).then(canvas => {
            const link = document.createElement('a');
            link.download = 'haiti-lineup.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    window.
