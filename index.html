<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRENADIERS ELITE - V3 FIXED</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --haiti-blue: #00209F; --haiti-red: #D21034;
            --pitch-green: #2e7d32; --pitch-dark: #1b5e20;
            --line-white: rgba(255, 255, 255, 0.9); --accent: #FFD700;
        }
        
        body { 
            font-family: sans-serif; margin: 0; background: #000; color: white; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
            touch-action: none; 
        }

        /* --- HEADER --- */
        #app-header {
            background: linear-gradient(90deg, var(--haiti-blue) 50%, var(--haiti-red) 50%);
            padding: 10px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 3px solid var(--accent); z-index: 2000;
        }
        #team-crest-box { width: 45px; height: 45px; border: 2px solid white; border-radius: 50%; overflow: hidden; background: white; }
        #team-crest-box img { width: 100%; height: 100%; object-fit: contain; }

        /* --- 3D ARENA --- */
        #stage {
            flex: 1; perspective: 1000px; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #222, #000); overflow: hidden; position: relative;
        }

        #pitch-container {
            position: relative; transform: rotateX(20deg); transform-style: preserve-3d;
            width: 90%; height: 55vh;
        }

        #pitch {
            width: 100%; height: 100%; background-color: var(--pitch-green);
            background-image: repeating-linear-gradient(0deg, var(--pitch-green), var(--pitch-green) 10%, var(--pitch-dark) 10%, var(--pitch-dark) 20%);
            position: relative; border: 3px solid var(--line-white);
        }

        /* BANDEROLS */
        .banderol { position: absolute; background: #111; overflow: hidden; white-space: nowrap; z-index: 5; border: 1px solid #444; }
        .banderol-content { display: inline-block; animation: scroll 15s linear infinite; color: var(--accent); font-weight: bold; font-size: 12px; padding: 4px 0; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .b-top { top: -22px; width: 100%; height: 22px; transform: rotateX(-90deg); transform-origin: bottom; }

        /* --- PLAYER --- */
        .player { 
            position: absolute; width: 60px; text-align: center; 
            z-index: 500; cursor: grab; touch-action: none;
            transition: transform 0.2s;
        }
        .player.dragging { z-index: 3000 !important; transform: scale(1.2); opacity: 0.8; }
        
        .jersey {
            width: 44px; height: 44px; background-color: var(--haiti-blue); border: 2.5px solid white;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: 900; color: white;
            background-size: cover; background-position: center; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .name-label { font-size: 10px; font-weight: bold; margin-top: 4px; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 3px; border-bottom: 2px solid var(--haiti-red); pointer-events: none; }

        /* --- FOOTER --- */
        #bench { 
            height: 85px; background: #111; border-top: 1px solid #333;
            display: flex; align-items: center; gap: 15px; overflow-x: auto; padding: 0 15px;
        }
        #controls { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #000; }
        button, select { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; background: #222; }
        .main-btn { grid-column: span 2; background: var(--haiti-red); }
    </style>
</head>
<body>

<div id="app-header">
    <div id="team-crest-box"><img id="crestPrev" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Coat_of_arms_of_Haiti.svg/1200px-Coat_of_arms_of_Haiti.svg.png"></div>
    <h1 style="font-size: 14px;">HAITI GRENADIERS</h1>
    <button onclick="saveAll()" style="background:var(--haiti-blue); padding: 5px 10px;">SAVE ALL</button>
</div>

<div id="stage">
    <div id="pitch-container">
        <div class="banderol b-top"><div class="banderol-content"><span>GRENADIER ALASO!</span><span>DIGICEL</span><span>NATCOM</span><span>AYITI CHERI</span></div></div>
        <div id="pitch"></div>
    </div>
</div>

<div id="bench"></div>

<div id="controls">
    <button onclick="addNewPlayer()">➕ ADD SUB</button>
    <button onclick="loadAll()">📂 LOAD DATA</button>
    <button class="main-btn" onclick="exportImg()">📸 EXPORT PHOTO</button>
</div>

<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:4000; padding:40px;">
    <h3>EDIT JOUEUR</h3>
    <input type="text" id="pName" placeholder="Name" style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="file" id="pImg" accept="image/*" style="margin-bottom:20px;">
    <button onclick="applyEdit()" style="width:100%; padding:15px; background:var(--haiti-blue); color:white; border:none;">APPLY</button>
    <button onclick="closeModal()" style="width:100%; padding:10px; margin-top:10px; background:#333; color:white; border:none;">CANCEL</button>
</div>

<script>
    let activePlayer = null;
    let pitch = document.getElementById('pitch');
    let bench = document.getElementById('bench');

    // FIX DRAGGING: Direct event attachment
    function initDrag(el) {
        el.onpointerdown = (e) => {
            activePlayer = el;
            el.classList.add('dragging');
            el.setPointerCapture(e.pointerId);
        };

        el.onpointermove = (e) => {
            if (!activePlayer) return;
            // Get position relative to the stage to handle 3D perspective correctly
            let stage = document.getElementById('stage').getBoundingClientRect();
            let x = e.clientX - stage.left - 30;
            let y = e.clientY - stage.top - 30;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.position = 'fixed'; // Float above 3D transform during drag
        };

        el.onpointerup = (e) => {
            if (!activePlayer) return;
            el.classList.remove('dragging');
            
            let benchRect = bench.getBoundingClientRect();
            if (e.clientY > benchRect.top) {
                bench.appendChild(el);
                el.style.position = 'static';
            } else {
                pitch.appendChild(el);
                el.style.position = 'absolute';
                let pRect = pitch.getBoundingClientRect();
                el.style.left = ((e.clientX - pRect.left - 30) / pRect.width * 100) + '%';
                el.style.top = ((e.clientY - pRect.top - 30) / pRect.height * 100) + '%';
            }
            
            if (Math.abs(e.clientX - startX) < 5) openModal(el); // Click vs Drag
            activePlayer = null;
        };
        
        let startX;
        el.addEventListener('pointerdown', (e) => startX = e.clientX);
    }

    function addNewPlayer(data = null) {
        const p = document.createElement('div');
        p.className = 'player';
        const name = data ? data.n : 'JOUEUR';
        const img = data ? data.img : '';
        const bg = img ? `background-image:url(${img})` : '';

        p.innerHTML = `
            <div class="jersey" style="${bg}"></div>
            <div class="name-label">${name}</div>
        `;
        
        if (data && !data.onBench) {
            pitch.appendChild(p);
            p.style.left = data.x; p.style.top = data.y;
        } else {
            bench.appendChild(p);
            p.style.position = 'static';
        }
        
        initDrag(p);
    }

    // SAVING PICTURES (Converts to Base64)
    function saveAll() {
        const players = [];
        document.querySelectorAll('.player').forEach(p => {
            players.push({
                n: p.querySelector('.name-label').innerText,
                img: p.querySelector('.jersey').style.backgroundImage.replace(/url\(["']?|["']?\)/g, ''),
                x: p.style.left,
                y: p.style.top,
                onBench: p.parentElement.id === 'bench'
            });
        });
        localStorage.setItem('grenadier_v3', JSON.stringify(players));
        alert("Tout Sove! (All Saved)");
    }

    function loadAll() {
        const data = JSON.parse(localStorage.getItem('grenadier_v3'));
        if (!data) return;
        pitch.innerHTML = '';
        bench.innerHTML = '';
        data.forEach(d => addNewPlayer(d));
    }

    function openModal(el) {
        activePlayer = el;
        document.getElementById('pName').value = el.querySelector('.name-label').innerText;
        document.getElementById('modal').style.display = 'block';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function applyEdit() {
        activePlayer.querySelector('.name-label').innerText = document.getElementById('pName').value;
        const file = document.getElementById('pImg').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => activePlayer.querySelector('.jersey').style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(file);
        }
        closeModal();
    }

    function exportImg() {
        html2canvas(document.getElementById('stage')).then(canvas => {
            const link = document.createElement('a');
            link.download = 'haiti-lineup.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    // Initial Load
    window.onload = () => { if(!localStorage.getItem('grenadier_v3')) addNewPlayer(); else loadAll(); };
</script>
</body>
</html>
