<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOCLINEUP JPTECH 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --pitch-green: #388e3c; 
            --pitch-dark: #2e7d32;
            --line-white: rgba(255, 255, 255, 0.6); 
            --accent: #00e676;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background: #0a0a0a; 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        #app-header {
            background: #111;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        #app-header h1 { margin: 0; font-size: 16px; color: var(--accent); letter-spacing: 2px; }

        /* --- 3D PITCH SYSTEM --- */
        #stage {
            flex: 1;
            perspective: 1000px; /* Essential for 3D */
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden;
        }

        #pitch {
            width: 90%;
            height: 85%;
            background-color: var(--pitch-green);
            /* Lineup 11 Style Striped Grass */
            background-image: repeating-linear-gradient(
                0deg,
                var(--pitch-green),
                var(--pitch-green) 10%,
                var(--pitch-dark) 10%,
                var(--pitch-dark) 20%
            );
            position: relative; 
            border: 3px solid var(--line-white);
            /* The 3D Tilt */
            transform: rotateX(25deg) rotateZ(0deg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Field Markings */
        .line { position: absolute; border: 1.5px solid var(--line-white); pointer-events: none; }
        .halfway { top: 50%; width: 100%; border-bottom: 2px solid var(--line-white); }
        .center-circle { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border-radius: 50%; }
        .penalty-box { left: 15%; width: 70%; height: 18%; border-top: none; }
        .penalty-box.top { top: 0; }
        .penalty-box.bottom { bottom: 0; border-bottom: none; }
        .penalty-arc { left: 35%; width: 30%; height: 8%; border-radius: 50%; border: 1.5px solid var(--line-white); }
        .penalty-arc.top { top: 12%; border-top: none; }
        .penalty-arc.bottom { bottom: 12%; border-bottom: none; }

        /* --- 3D PLAYERS --- */
        .player {
            position: absolute; width: 60px; text-align: center; touch-action: none; cursor: grab; z-index: 20;
        }
        .jersey {
            width: 40px; height: 40px; background-color: #d32f2f; border: 2px solid white;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; font-size: 14px;
            box-shadow: 0 6px 0px #8b0000, 0 10px 15px rgba(0,0,0,0.5); /* 3D Shadow Effect */
            background-size: cover;
        }
        .name-label { 
            font-size: 10px; font-weight: bold; margin-top: 8px; 
            background: rgba(0,0,0,0.8); padding: 2px 8px; border-radius: 12px;
            text-transform: uppercase; border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- MOBILE NAV --- */
        #controls { 
            padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #333;
        }
        button { 
            flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; color: white; background: #333; font-size: 12px;
        }

        /* --- MODAL --- */
        #editModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #444; z-index: 100; width: 80%;
        }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #222; color: white; }
    </style>
</head>
<body>

<div id="app-header">
    <h1>SOCLINEUP JPTECH</h1>
</div>

<div id="stage">
    <div id="pitch">
        <div class="line halfway"></div>
        <div class="line center-circle"></div>
        <div class="line penalty-box top"></div>
        <div class="line penalty-arc top"></div>
        <div class="line penalty-box bottom"></div>
        <div class="line penalty-arc bottom"></div>
        </div>
</div>

<div id="controls">
    <button style="background: var(--accent); color: black;" onclick="downloadLineup()">SAVE LINEUP</button>
    <button onclick="resetPositions()">RESET</button>
</div>

<div class="modal-overlay" id="overlay"></div>
<div id="editModal">
    <h3>Edit Player</h3>
    <input type="text" id="editName" placeholder="Player Name">
    <input type="number" id="editNum" placeholder="Number">
    <input type="color" id="editColor" value="#d32f2f">
    <input type="file" id="editImg" accept="image/*">
    <div style="display:flex; gap:10px; margin-top:10px;">
        <button style="background:#28a745" onclick="saveChanges()">APPLY</button>
        <button style="background:#444" onclick="closeModal()">CLOSE</button>
    </div>
</div>

<script>
    let currentPlayer = null;
    const defaultPositions = [
        { y: 85, x: 42, color: '#ffd600', name: 'GK', num: 1 },
        { y: 70, x: 10 }, { y: 72, x: 32 }, { y: 72, x: 53 }, { y: 70, x: 75 },
        { y: 45, x: 20 }, { y: 45, x: 42 }, { y: 45, x: 65 },
        { y: 20, x: 15 }, { y: 15, x: 42 }, { y: 20, x: 70 }
    ];

    function initPitch() {
        const savedData = JSON.parse(localStorage.getItem('soccerRoster3D'));
        const dataToUse = savedData || defaultPositions;

        dataToUse.forEach((p, i) => {
            const playerDiv = document.createElement('div');
            playerDiv.className = 'player';
            playerDiv.style.top = p.y + '%';
            playerDiv.style.left = p.x + '%';

            playerDiv.innerHTML = `
                <div class="jersey" style="background-color: ${p.color || '#d32f2f'}; background-image: url(${p.img || ''})">${p.num || (i+1)}</div>
                <div class="name-label">${p.name || 'PLAYER'}</div>
            `;

            playerDiv.addEventListener('click', () => openModal(playerDiv));
            makeDraggable(playerDiv);
            document.getElementById('pitch').appendChild(playerDiv);
        });
    }

    function openModal(el) {
        currentPlayer = el;
        document.getElementById('editName').value = el.querySelector('.name-label').innerText;
        document.getElementById('editNum').value = el.querySelector('.jersey').innerText;
        document.getElementById('editModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function saveChanges() {
        const name = document.getElementById('editName').value;
        const num = document.getElementById('editNum').value;
        const color = document.getElementById('editColor').value;
        const file = document.getElementById('editImg').files[0];

        currentPlayer.querySelector('.name-label').innerText = name;
        currentPlayer.querySelector('.jersey').innerText = num;
        currentPlayer.querySelector('.jersey').style.backgroundColor = color;

        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentPlayer.querySelector('.jersey').style.backgroundImage = `url(${e.target.result})`;
                saveToStorage();
            };
            reader.readAsDataURL(file);
        } else {
            saveToStorage();
        }
        closeModal();
    }

    function makeDraggable(el) {
        let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        const dragStart = (e) => {
            const touch = e.type === "touchstart" ? e.touches[0] : e;
            initialX = touch.clientX - xOffset;
            initialY = touch.clientY - yOffset;
            if (e.target.closest('.player')) active = true;
        };
        const dragMove = (e) => {
            if (active) {
                e.preventDefault();
                const touch = e.type === "touchmove" ? e.touches[0] : e;
                currentX = touch.clientX - initialX;
                currentY = touch.clientY - initialY;
                xOffset = currentX; yOffset = currentY;
                el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        };
        const dragEnd = () => { active = false; saveToStorage(); };
        el.addEventListener('touchstart', dragStart, {passive: false});
        el.addEventListener('touchmove', dragMove, {passive: false});
        el.addEventListener('touchend', dragEnd);
        el.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);
    }

    function saveToStorage() {
        const data = [];
        document.querySelectorAll('.player').forEach(p => {
            data.push({
                name: p.querySelector('.name-label').innerText,
                num: p.querySelector('.jersey').innerText,
                color: p.querySelector('.jersey').style.backgroundColor,
                img: p.querySelector('.jersey').style.backgroundImage.slice(5, -2).replace(/"/g, ""),
                x: p.style.left, y: p.style.top
            });
        });
        localStorage.setItem('soccerRoster3D', JSON.stringify(data));
    }

    function downloadLineup() {
        // Temporarily remove 3D tilt for a clean screenshot if preferred, 
        // but most users like the tilt in the photo.
        html2canvas(document.getElementById('stage'), { backgroundColor: '#000' }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'my-lineup.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function resetPositions() {
        localStorage.removeItem('soccerRoster3D');
        location.reload();
    }

    window.onload = initPitch;
</script>
</body>
</html>
