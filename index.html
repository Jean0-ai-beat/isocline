<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRENADIERS LINEUP PRO - HAITI EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --haiti-blue: #00209F;
            --haiti-red: #D21034;
            --pitch-green: #2e7d32; 
            --pitch-dark: #1b5e20;
            --line-white: rgba(255, 255, 255, 0.9); 
            --accent: #FFD700; /* Gold for champions */
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            margin: 0; background: #050505; color: white; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
            touch-action: none; overscroll-behavior: none;
        }

        /* --- HAITIAN THEME HEADER --- */
        #app-header {
            background: linear-gradient(90deg, var(--haiti-blue) 50%, var(--haiti-red) 50%);
            padding: 12px 15px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 3px solid var(--accent); z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #team-crest-box {
            width: 55px; height: 55px; border: 2px solid white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: white; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        #team-crest-box img { width: 85%; height: 85%; object-fit: contain; }
        #app-header h1 { margin: 0; font-size: 16px; color: white; flex: 1; text-align: center; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        /* --- 3D ARENA --- */
        #stage {
            flex: 1; perspective: 1400px; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden; position: relative;
        }

        #pitch-container {
            position: relative; transform: rotateX(28deg); transform-style: preserve-3d;
            width: 90%; height: 55vh;
        }

        /* --- SPONSOR BANDEROL (LED BOARDS) --- */
        .banderol {
            position: absolute; background: #111; border: 2px solid #444;
            display: flex; align-items: center; overflow: hidden; white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .banderol-content {
            display: inline-block; animation: scroll-ads 20s linear infinite;
            color: var(--accent); font-weight: bold; font-size: 14px; text-transform: uppercase;
        }
        .banderol-content span { margin: 0 40px; }

        @keyframes scroll-ads {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Positions for Banderols */
        .b-top { top: -25px; left: 0; width: 100%; height: 25px; transform: rotateX(-90deg); transform-origin: bottom; }
        .b-left { top: 0; left: -25px; width: 55vh; height: 25px; transform: rotateZ(90deg) rotateX(-90deg); transform-origin: top left; }
        .b-right { top: 0; right: -25px; width: 55vh; height: 25px; transform: rotateZ(-90deg) rotateX(-90deg); transform-origin: top right; }

        #pitch {
            width: 100%; height: 100%;
            background-color: var(--pitch-green);
            background-image: repeating-linear-gradient(0deg, var(--pitch-green), var(--pitch-green) 10%, var(--pitch-dark) 10%, var(--pitch-dark) 20%);
            position: relative; border: 4px solid var(--line-white);
        }

        .line { position: absolute; border: 2px solid var(--line-white); pointer-events: none; }
        .halfway { top: 50%; width: 100%; border-bottom: 3px solid var(--line-white); transform: translateY(-50%); }
        .center-circle { top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box { left: 15%; width: 70%; height: 18%; border: 3px solid var(--line-white); }
        .penalty-box.top { top: 0; border-top: none; }
        .penalty-box.bottom { bottom: 0; border-bottom: none; }

        /* --- PLAYER STYLING --- */
        .player { 
            position: absolute; width: 65px; text-align: center; 
            z-index: 500; cursor: grab;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1), top 0.4s ease, left 0.4s ease;
            will-change: transform, top, left; touch-action: none;
        }

        .player.is-dragging {
            transition: none; transform: scale(1.3) !important;
            z-index: 1000; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
        }

        .jersey {
            width: 48px; height: 48px; background-color: var(--haiti-blue); border: 3px solid white;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: 900; font-size: 18px; color: white;
            background-size: cover; background-position: center; position: relative;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4); pointer-events: none;
        }

        .player.is-dragging .jersey { border-color: var(--accent); box-shadow: 0 0 20px var(--accent); }

        .name-label { 
            font-size: 11px; font-weight: bold; margin-top: 6px; 
            background: rgba(0,0,0,0.85); color: white; padding: 3px 8px; 
            border-radius: 4px; white-space: nowrap; pointer-events: none;
            border-bottom: 2px solid var(--haiti-red);
        }

        /* --- BENCH & CONTROLS --- */
        #bench-area { background: #111; padding: 10px 0; border-top: 2px solid #333; }
        #bench { 
            width: 92%; height: 90px; margin: 0 auto; border: 2px dashed #444; border-radius: 15px;
            display: flex; align-items: center; gap: 15px; overflow-x: auto; padding: 0 15px;
            background: rgba(0,0,0,0.4);
        }

        #controls { padding: 15px; background: #000; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button, select { padding: 14px; border: none; border-radius: 10px; font-weight: 800; color: white; background: #222; font-size: 12px; cursor: pointer; text-transform: uppercase; }
        .add-player-btn { background: var(--haiti-blue); border: 1px solid white; }
        .main-btn { background: var(--haiti-red); color: white; grid-column: span 2; font-size: 14px; letter-spacing: 1px; }

        /* --- MODAL --- */
        #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; backdrop-filter: blur(8px); }
        #edit-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; padding: 30px; border-radius: 25px; width: 85%; z-index: 2001; border: 2px solid var(--haiti-blue);
        }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 10px; color: #aaa; margin-bottom: 5px; }
        input, select { width: 100%; padding: 14px; background: #000; border: 1px solid #333; color: white; border-radius: 10px; }
    </style>
</head>
<body>

<div id="app-header">
    <div id="team-crest-box" onclick="document.getElementById('crestIn').click()">
        <img id="crestPrev" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Coat_of_arms_of_Haiti.svg/1200px-Coat_of_arms_of_Haiti.svg.png">
    </div>
    <input type="file" id="crestIn" hidden accept="image/*" onchange="loadCrest(this)">
    <h1>HAITI GRENADIERS</h1>
    <button style="background:none; border:1px solid white; border-radius:5px; padding:5px 10px;" onclick="saveData()">SAVE</button>
</div>

<div id="stage">
    <div id="pitch-container">
        <div class="banderol b-top"><div class="banderol-content"><span>HAITI LIBERTÉ</span><span>DIGICEL</span><span>NATCOM</span><span>GRENADIER ALASO!</span><span>BRANA</span></div></div>
        <div class="banderol b-left"><div class="banderol-content"><span>FEDERATION HAITIENNE DE FOOTBALL</span><span>AYITI CHERI</span></div></div>
        <div class="banderol b-right"><div class="banderol-content"><span>L'UNION FAIT LA FORCE</span><span>VISIT HAITI</span></div></div>
        
        <div id="pitch">
            <div class="line halfway"></div>
            <div class="line center-circle"></div>
            <div class="line penalty-box top"></div>
            <div class="line penalty-box bottom"></div>
        </div>
    </div>
</div>

<div id="bench-area">
    <div id="bench"></div>
</div>

<div id="controls">
    <button class="add-player-btn" onclick="addNewBenchPlayer()">➕ ADD SUB</button>
    <select onchange="changeFormation(this.value)">
        <option value="">FORMATIONS</option>
        <option value="442">4-4-2</option>
        <option value="433">4-3-3</option>
        <option value="352">3-5-2</option>
    </select>
    <button class="main-btn" onclick="exportImage()">📸 EXPORT HD LINEUP IMAGE</button>
</div>

<div id="modal-overlay" onclick="closeModal()"></div>
<div id="edit-modal">
    <h2 style="margin-top:0; color:var(--haiti-red)">MODIFIER JOUEUR</h2>
    <div class="field"><label>NON JOUEUR</label><input type="text" id="pName"></div>
    <div class="field"><label>NIMEWO</label><input type="number" id="pNum"></div>
    <div class="field">
        <label>COULEUR JERSEY</label>
        <div style="display:flex; gap:10px;">
            <input type="color" id="pColor" style="height:50px;">
            <select id="pPattern">
                <option value="">Solid</option>
                <option value="striped">Striped</option>
                <option value="hooped">Hooped</option>
            </select>
        </div>
    </div>
    <div class="field"><label>CHWAZI FOTO</label><input type="file" id="pImg" accept="image/*"></div>
    <button style="background:var(--haiti-blue); width:100%; padding:15px; margin-top:10px;" onclick="applyPlayerChanges()">SOVE CHANCHMAN</button>
</div>

<script>
    let activePlayer = null;
    let isDragging = false;
    let startX, startY;

    const initialPlayers = [
        {y:88, x:43, n:'JOHNY PLACIDE', num:1, c:'#ffd600'},
        {y:72, x:10, n:'ARCUS', num:2}, {y:75, x:32, n:'ADÉ', num:4}, {y:75, x:53, n:'PIERRE', num:6}, {y:72, x:75, n:'ALEXIS', num:3},
        {y:48, x:22, n:'SABA', num:8}, {y:50, x:43, n:'ALCEUS', num:10}, {y:48, x:64, n:'METUSALA', num:5},
        {y:20, x:15, n:'PIERROT', num:9}, {y:12, x:43, n:'NAZON', num:20}, {y:20, x:72, n:'DEPRÈS', num:11}
    ];

    function createPlayer(data, parent) {
        const p = document.createElement('div');
        p.className = 'player';
        if(parent.id === 'pitch') {
            p.style.top = data.y + '%';
            p.style.left = data.x + '%';
        } else {
            p.style.position = 'static';
            p.style.transform = 'scale(0.85)';
        }

        p.innerHTML = `
            <div class="jersey" style="background-color:${data.c || '#00209F'}">
                <div class="pattern"></div>
                <span class="num-txt">${data.num || '?'}</span>
            </div>
            <div class="name-label">${data.n || 'JOUEUR'}</div>
        `;
        
        p.addEventListener('pointerdown', handlePointerDown);
        parent.appendChild(p);
    }

    function handlePointerDown(e) {
        activePlayer = e.currentTarget;
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        activePlayer.setPointerCapture(e.pointerId);
    }

    function handlePointerMove(e) {
        if (!activePlayer) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            isDragging = true;
            activePlayer.classList.add('is-dragging');
            activePlayer.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(1.3)`;
        }
    }

    function handlePointerUp(e) {
        if (!activePlayer) return;
        window.removeEventListener('pointermove', handlePointerMove);
        window.removeEventListener('pointerup', handlePointerUp);

        if (!isDragging) {
            openModal(activePlayer);
        } else {
            const bench = document.getElementById('bench');
            const pitch = document.getElementById('pitch');
            const bRect = bench.getBoundingClientRect();
            activePlayer.classList.remove('is-dragging');

            if (e.clientY > bRect.top) {
                bench.appendChild(activePlayer);
                activePlayer.style.position = 'static';
                activePlayer.style.transform = 'scale(0.85)';
            } else {
                pitch.appendChild(activePlayer);
                activePlayer.style.position = 'absolute';
                const pRect = pitch.getBoundingClientRect();
                activePlayer.style.left = ((e.clientX - pRect.left - 32) / pRect.width * 100) + '%';
                activePlayer.style.top = ((e.clientY - pRect.top - 32) / pRect.height * 100) + '%';
                activePlayer.style.transform = 'none';
            }
        }
        activePlayer = null;
    }

    function openModal(el) {
        activePlayer = el;
        document.getElementById('pName').value = el.querySelector('.name-label').innerText;
        document.getElementById('pNum').value = el.querySelector('.num-txt').innerText;
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('edit-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('edit-modal').style.display = 'none';
    }

    function applyPlayerChanges() {
        const jersey = activePlayer.querySelector('.jersey');
        activePlayer.querySelector('.name-label').innerText = document.getElementById('pName').value;
        jersey.querySelector('.num-txt').innerText = document.getElementById('pNum').value;
        jersey.style.backgroundColor = document.getElementById('pColor').value;
        const file = document.getElementById('pImg').files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = (e) => jersey.style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(file);
        }
        closeModal();
    }

    function addNewBenchPlayer() {
        createPlayer({n: 'NOUVO', num: 12, c: '#D21034'}, document.getElementById('bench'));
    }

    function changeFormation(val) {
        const ps = document.querySelectorAll('#pitch .player');
        const pitch = document.getElementById('pitch');
        let c = [];
        if(val==='442') c=[{y:88,x:43},{y:72,x:10},{y:75,x:32},{y:75,x:53},{y:72,x:75},{y:50,x:10},{y:52,x:35},{y:52,x:52},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        if(val==='433') c=[{y:88,x:43},{y:72,x:10},{y:75,x:32},{y:75,x:53},{y:72,x:75},{y:52,x:22},{y:55,x:43},{y:52,x:64},{y:22,x:15},{y:15,x:43},{y:22,x:72}];
        if(val==='352') c=[{y:88,x:43},{y:75,x:22},{y:78,x:43},{y:75,x:64},{y:50,x:10},{y:52,x:28},{y:55,x:43},{y:52,x:58},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        
        c.forEach((pos, i) => {
            if(ps[i]) {
                ps[i].style.top = pos.y + '%';
                ps[i].style.left = pos.x + '%';
            }
        });
    }

    function loadCrest(input) {
        if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('crestPrev').src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    function exportImage() {
        html2canvas(document.getElementById('stage'), {scale: 3}).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Haiti_Lineup.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    window.onload = () => {
        const pitch = document.getElementById('pitch');
        initialPlayers.forEach(p => createPlayer(p, pitch));
    };
</script>
</body>
</html>
