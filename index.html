<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SOCLINEUP PRO | JPTECH</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --pitch-green: #24732a; 
            --line-white: rgba(255, 255, 255, 0.8);
            --accent: #ff9800;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            margin: 0; background: #000; color: white; height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* --- HEADER & FORMATION SELECTOR --- */
        #top-bar {
            background: #1a1a1a; padding: 15px; text-align: center; z-index: 20;
            border-bottom: 1px solid #333;
        }
        select {
            background: #333; color: white; border: 1px solid var(--accent);
            padding: 8px 15px; border-radius: 20px; font-weight: bold; width: 60%;
        }

        /* --- THE PRO PITCH --- */
        #stage { flex: 1; display: flex; align-items: center; justify-content: center; background: #111; }
        
        #pitch {
            width: 95vw; height: 75vh; background-color: var(--pitch-green);
            position: relative; border: 3px solid var(--line-white);
            background-image: repeating-linear-gradient(0deg, transparent, transparent 10%, rgba(0,0,0,0.05) 10%, rgba(0,0,0,0.05) 20%);
            overflow: hidden;
        }

        .line { position: absolute; border: 2px solid var(--line-white); pointer-events: none; }
        
        /* Pitch Markings */
        .halfway { top: 50%; width: 100%; border-bottom: 2px solid var(--line-white); }
        .center-circle { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border-radius: 50%; }
        .center-spot { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: var(--line-white); border-radius: 50%; }
        
        /* Penalty Box (18yd) */
        .penalty-box { left: 20%; width: 60%; height: 16%; }
        .box-top { top: 0; border-top: none; }
        .box-bottom { bottom: 0; border-bottom: none; }

        /* Goal Area (6yd) */
        .goal-area { left: 35%; width: 30%; height: 6%; }
        .goal-top { top: 0; border-top: none; }
        .goal-bottom { bottom: 0; border-bottom: none; }

        /* Penalty Arc (The D) */
        .arc { width: 60px; height: 30px; border-radius: 0 0 50px 50px; left: 50%; transform: translateX(-50%); }
        .arc-top { top: 16%; border-top: none; }
        .arc-bottom { bottom: 16%; border-radius: 50px 50px 0 0; border-bottom: none; }

        /* Corners */
        .corner { width: 15px; height: 15px; border-radius: 50%; }
        .c-tl { top: -8px; left: -8px; } .c-tr { top: -8px; right: -8px; }
        .c-bl { bottom: -8px; left: -8px; } .c-br { bottom: -8px; right: -8px; }

        /* --- PLAYERS --- */
        .player { position: absolute; width: 60px; text-align: center; touch-action: none; z-index: 10; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .jersey {
            width: 44px; height: 44px; background: #d32f2f; border: 2px solid #fff;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            background-size: cover; background-position: center;
        }
        .name-label { font-size: 10px; font-weight: bold; margin-top: 4px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 5px; }

        /* --- UI CONTROLS --- */
        #controls { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; border-top: 1px solid #333; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div id="top-bar">
    <select id="formationSelect" onchange="applyFormation()">
        <option value="442">Formation: 4-4-2</option>
        <option value="433">Formation: 4-3-3</option>
        <option value="352">Formation: 3-5-2</option>
        <option value="4231">Formation: 4-2-3-1</option>
    </select>
</div>

<div id="stage">
    <div id="pitch">
        <div class="line halfway"></div>
        <div class="line center-circle"></div>
        <div class="line center-spot"></div>
        
        <div class="line penalty-box box-top"></div>
        <div class="line goal-area goal-top"></div>
        <div class="line arc arc-top"></div>
        
        <div class="line penalty-box box-bottom"></div>
        <div class="line goal-area goal-bottom"></div>
        <div class="line arc arc-bottom"></div>

        <div class="line corner c-tl"></div><div class="line corner c-tr"></div>
        <div class="line corner c-bl"></div><div class="line corner c-br"></div>
    </div>
</div>

<div id="controls">
    <button style="background: var(--accent);" onclick="downloadLineup()">📸 SAVE LINEUP</button>
    <button style="background: #444;" onclick="resetPitch()">🔄 RESET</button>
</div>

<script>
    const formations = {
        "442": [
            {y:88, x:42}, // GK
            {y:72, x:10}, {y:75, x:32}, {y:75, x:53}, {y:72, x:75}, // DEF
            {y:45, x:10}, {y:48, x:32}, {y:48, x:53}, {y:45, x:75}, // MID
            {y:15, x:32}, {y:15, x:53} // ATT
        ],
        "433": [
            {y:88, x:42},
            {y:72, x:10}, {y:75, x:32}, {y:75, x:53}, {y:72, x:75},
            {y:50, x:25}, {y:55, x:42}, {y:50, x:60},
            {y:15, x:15}, {y:12, x:42}, {y:15, x:70}
        ],
        "352": [
            {y:88, x:42},
            {y:75, x:25}, {y:78, x:42}, {y:75, x:60},
            {y:45, x:8}, {y:50, x:25}, {y:50, x:42}, {y:50, x:60}, {y:45, x:78},
            {y:15, x:32}, {y:15, x:53}
        ],
        "4231": [
            {y:88, x:42},
            {y:72, x:10}, {y:75, x:32}, {y:75, x:53}, {y:72, x:75},
            {y:55, x:32}, {y:55, x:53},
            {y:35, x:15}, {y:32, x:42}, {y:35, x:70},
            {y:12, x:42}
        ]
    };

    function initPlayers() {
        const pitch = document.getElementById('pitch');
        // Clear existing players
        document.querySelectorAll('.player').forEach(p => p.remove());
        
        formations["442"].forEach((pos, i) => {
            const p = document.createElement('div');
            p.className = 'player';
            p.id = 'p' + i;
            p.style.top = pos.y + '%';
            p.style.left = pos.x + '%';
            p.innerHTML = `
                <div class="jersey">${i+1}</div>
                <div class="name-label">Player ${i+1}</div>
            `;
            makeDraggable(p);
            pitch.appendChild(p);
        });
    }

    function applyFormation() {
        const f = document.getElementById('formationSelect').value;
        const coords = formations[f];
        coords.forEach((pos, i) => {
            const p = document.getElementById('p' + i);
            if(p) {
                p.style.top = pos.y + '%';
                p.style.left = pos.x + '%';
            }
        });
    }

    function makeDraggable(el) {
        let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        const dragStart = (e) => {
            initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOffset;
            initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOffset;
            if (e.target.closest('.player')) active = true;
        };
        const dragMove = (e) => {
            if (active) {
                e.preventDefault();
                currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
                currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;
                xOffset = currentX; yOffset = currentY;
                el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        };
        const dragEnd = () => { active = false; };
        el.addEventListener('touchstart', dragStart); el.addEventListener('touchmove', dragMove); el.addEventListener('touchend', dragEnd);
        el.addEventListener('mousedown', dragStart); document.addEventListener('mousemove', dragMove); document.addEventListener('mouseup', dragEnd);
    }

    function downloadLineup() {
        html2canvas(document.getElementById('pitch')).then(canvas => {
            const link = document.createElement('a');
            link.download = 'jptech-lineup.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function resetPitch() { location.reload(); }

    window.onload = initPlayers;
</script>
</body>
</html>
