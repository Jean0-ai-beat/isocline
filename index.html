<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOCLINEUP JPTECH VERIFIED</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --pitch-green: #388e3c; 
            --pitch-dark: #2e7d32;
            --line-white: rgba(255, 255, 255, 0.7); 
            --accent: #00e676;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; background: #000; color: white; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }

        /* --- HEADER --- */
        #app-header {
            background: #111; padding: 12px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #333; z-index: 100;
        }
        #team-crest-box {
            width: 48px; height: 48px; border: 2px dashed #444; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: #1a1a1a; cursor: pointer; position: relative;
        }
        #team-crest-box img { width: 100%; height: 100%; object-fit: contain; position: absolute; }
        #app-header h1 { margin: 0; font-size: 15px; color: var(--accent); flex: 1; text-align: center; text-transform: uppercase; letter-spacing: 1px; }

        /* --- 3D STAGE --- */
        #stage {
            flex: 1; perspective: 1500px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #222 0%, #000 100%);
        }

        #pitch {
            width: 92%; height: 55vh;
            background-color: var(--pitch-green);
            background-image: repeating-linear-gradient(0deg, var(--pitch-green), var(--pitch-green) 10%, var(--pitch-dark) 10%, var(--pitch-dark) 20%);
            position: relative; border: 3px solid var(--line-white);
            transform: rotateX(25deg); 
            transform-style: preserve-3d;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }

        /* Pitch Markings */
        .line { position: absolute; border: 1.5px solid var(--line-white); pointer-events: none; }
        .halfway { top: 50%; width: 100%; border-bottom: 2px solid var(--line-white); }
        .center-circle { top: 50%; left: 50%; transform: translate(-50%, -50%) translateZ(1px); width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--line-white); }
        .penalty-box { left: 15%; width: 70%; height: 18%; border: 2px solid var(--line-white); }
        .penalty-box.top { top: 0; border-top: none; }
        .penalty-box.bottom { bottom: 0; border-bottom: none; }

        /* --- PLAYERS --- */
        .player { 
            position: absolute; width: 60px; text-align: center; 
            touch-action: none; cursor: grab; z-index: 50;
            transform-style: preserve-3d;
        }
        .jersey {
            width: 48px; height: 48px; background-color: #d32f2f; border: 2px solid #fff;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; font-size: 17px; color: white;
            box-shadow: 0 5px 0px rgba(0,0,0,0.5);
            background-size: cover; background-position: center; overflow: hidden; position: relative;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .pattern-overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; opacity: 0.4; }
        .striped { background-image: linear-gradient(90deg, #000 50%, transparent 50%); background-size: 12px 100%; }
        .hooped { background-image: linear-gradient(0deg, #000 50%, transparent 50%); background-size: 100% 12px; }

        .name-label { 
            font-size: 10px; font-weight: bold; margin-top: 6px; 
            background: rgba(0,0,0,0.85); padding: 3px 8px; border-radius: 4px; 
            white-space: nowrap; border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- BENCH --- */
        #bench-container { background: #111; border-top: 1px solid #333; padding: 12px 0; text-align: center; }
        #bench { 
            width: 90%; height: 80px; border: 2px dashed #444; border-radius: 12px; 
            margin: 0 auto; display: flex; align-items: center; justify-content: center; 
            gap: 10px; overflow-x: auto; background: rgba(0,0,0,0.3);
        }

        /* --- CONTROLS --- */
        #controls { padding: 12px; background: #000; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button, select { padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; background: #262626; font-size: 11px; }
        .save-btn { background: var(--accent); color: #000; grid-column: span 2; font-size: 13px; margin-top: 4px; }

        /* --- MODAL --- */
        #editModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1c1c1c; padding: 25px; border-radius: 20px; border: 1px solid #444; z-index: 2000; width: 88%; box-sizing: border-box;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; }
        .modal-field { margin-bottom: 18px; }
        .modal-field label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border-radius: 8px; background: #2a2a2a; color: white; border: 1px solid #3d3d3d; font-size: 14px; }
        input[type="file"] { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

<div id="app-header">
    <div id="team-crest-box" onclick="document.getElementById('crestInput').click()">
        <span id="crestText" style="font-size: 9px; color: #666;">LOGO</span>
        <img id="crestImg" src="">
    </div>
    <input type="file" id="crestInput" hidden accept="image/*" onchange="uploadCrest(this)">
    <h1>SOCLINEUP JPTECH</h1>
    <button onclick="saveRoster()" style="background: #333; font-size: 10px; padding: 8px 12px;">SAVE DATA</button>
</div>

<div id="stage">
    <div id="pitch">
        <div class="line halfway"></div>
        <div class="line center-circle"></div>
        <div class="line penalty-box top"></div>
        <div class="line penalty-box bottom"></div>
    </div>
</div>

<div id="bench-container">
    <div id="bench"></div>
</div>

<div id="controls">
    <select onchange="applyFormation(this.value)">
        <option value="">CHANGE FORMATION</option>
        <option value="442">4-4-2</option>
        <option value="433">4-3-3</option>
        <option value="352">3-5-2</option>
    </select>
    <button onclick="loadRoster()">LOAD PREVIOUS</button>
    <button class="save-btn" onclick="downloadLineup()">📸 EXPORT TO IMAGE</button>
</div>

<div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
<div id="editModal">
    <h3 style="margin: 0 0 20px 0; color: var(--accent); text-align: center;">Edit Player</h3>
    
    <div class="modal-field">
        <label>Player Name</label>
        <input type="text" id="editName" placeholder="Enter name...">
    </div>

    <div class="modal-field">
        <label>Number</label>
        <input type="number" id="editNum" placeholder="10">
    </div>

    <div class="modal-field">
        <label>Jersey Color & Style</label>
        <div style="display:flex; gap:10px;">
            <input type="color" id="editColor" value="#d32f2f" style="width: 70px; height: 45px; border:none; background:none;">
            <select id="editPattern">
                <option value="none">Solid Color</option>
                <option value="striped">Striped Style</option>
                <option value="hooped">Hooped Style</option>
            </select>
        </div>
    </div>

    <div class="modal-field">
        <label>Individual Photo / Face</label>
        <input type="file" id="editImg" accept="image/*">
    </div>

    <div style="display:flex; gap:10px; margin-top:25px;">
        <button style="background:var(--accent); color:black; flex:2; padding: 15px;" onclick="saveChanges()">APPLY</button>
        <button style="background:#333; flex:1" onclick="closeModal()">CLOSE</button>
    </div>
</div>

<script>
    let currentPlayer = null;
    let isDragging = false;
    const defaultData = [
        { y: 88, x: 43, n: 'GK', num: 1, c: '#ffd600' },
        { y: 72, x: 10 }, { y: 75, x: 32 }, { y: 75, x: 53 }, { y: 72, x: 75 },
        { y: 52, x: 22 }, { y: 55, x: 43 }, { y: 52, x: 64 },
        { y: 22, x: 15 }, { y: 15, x: 42 }, { y: 22, x: 70 }
    ];

    function init() {
        const pitch = document.getElementById('pitch');
        defaultData.forEach((p, i) => {
            createPlayer(p.y, p.x, p.n || 'PLAYER', p.num || i+1, p.c || '#d32f2f', pitch);
        });
    }

    function createPlayer(y, x, name, num, color, parent) {
        const div = document.createElement('div');
        div.className = 'player';
        div.style.top = y + '%';
        div.style.left = x + '%';
        div.innerHTML = `
            <div class="jersey" style="background-color:${color}">
                <div class="pattern-overlay"></div>
                <span class="num-text">${num}</span>
            </div>
            <div class="name-label">${name}</div>`;
        
        div.addEventListener('click', (e) => {
            if(!isDragging) openModal(div);
        });

        makeDraggable(div);
        parent.appendChild(div);
    }

    function openModal(el) {
        currentPlayer = el;
        document.getElementById('editName').value = el.querySelector('.name-label').innerText;
        document.getElementById('editNum').value = el.querySelector('.num-text').innerText;
        document.getElementById('editModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function saveChanges() {
        const jersey = currentPlayer.querySelector('.jersey');
        const patternOverlay = jersey.querySelector('.pattern-overlay');
        
        currentPlayer.querySelector('.name-label').innerText = document.getElementById('editName').value;
        jersey.querySelector('.num-text').innerText = document.getElementById('editNum').value;
        jersey.style.backgroundColor = document.getElementById('editColor').value;
        
        const pattern = document.getElementById('editPattern').value;
        patternOverlay.className = 'pattern-overlay ' + (pattern !== 'none' ? pattern : '');

        const file = document.getElementById('editImg').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                jersey.style.backgroundImage = `url(${e.target.result})`;
                jersey.querySelector('.num-text').style.opacity = '0.3'; // Dim number if photo is present
            };
            reader.readAsDataURL(file);
        }
        closeModal();
    }

    function makeDraggable(el) {
        let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        
        const dragStart = (e) => {
            const t = e.type === "touchstart" ? e.touches[0] : e;
            initialX = t.clientX - xOffset; initialY = t.clientY - yOffset;
            if (e.target.closest('.player')) { active = true; isDragging = false; }
        };

        const dragMove = (e) => {
            if (active) {
                e.preventDefault();
                isDragging = true;
                const t = e.type === "touchmove" ? e.touches[0] : e;
                currentX = t.clientX - initialX; currentY = t.clientY - initialY;
                xOffset = currentX; yOffset = currentY;
                el.style.transform = `translate3d(${currentX}px, ${currentY}px, 10px)`;
            }
        };

        const dragEnd = (e) => {
            if(!active) return;
            active = false;
            
            const bench = document.getElementById('bench');
            const rect = bench.getBoundingClientRect();
            const t = (e.type === "touchend") ? e.changedTouches[0] : e;
            
            if (t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                bench.appendChild(el);
                el.style.position = "static";
                el.style.transform = "scale(0.85)";
            } else {
                document.getElementById('pitch').appendChild(el);
                el.style.position = "absolute";
            }
        };

        el.addEventListener('touchstart', dragStart, {passive: false});
        el.addEventListener('touchmove', dragMove, {passive: false});
        el.addEventListener('touchend', dragEnd);
        el.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);
    }

    function applyFormation(val) {
        const players = document.querySelectorAll('.player');
        const pitch = document.getElementById('pitch');
        let coords = [];
        if(val === '442') coords = [{y:88,x:43}, {y:72,x:10}, {y:75,x:32}, {y:75,x:53}, {y:72,x:75}, {y:50,x:10}, {y:52,x:35}, {y:52,x:52}, {y:50,x:78}, {y:22,x:33}, {y:22,x:54}];
        if(val === '433') coords = [{y:88,x:43}, {y:72,x:10}, {y:75,x:32}, {y:75,x:53}, {y:72,x:75}, {y:52,x:22}, {y:55,x:43}, {y:52,x:64}, {y:22,x:15}, {y:15,x:43}, {y:22,x:72}];
        if(val === '352') coords = [{y:88,x:43}, {y:75,x:22}, {y:78,x:43}, {y:75,x:64}, {y:50,x:10}, {y:52,x:28}, {y:55,x:43}, {y:52,x:58}, {y:50,x:78}, {y:22,x:33}, {y:22,x:54}];
        
        coords.forEach((c, i) => {
            if(players[i]) {
                pitch.appendChild(players[i]);
                players[i].style.position = "absolute";
                players[i].style.top = c.y + '%';
                players[i].style.left = c.x + '%';
                players[i].style.transform = 'translate3d(0,0,0)';
            }
        });
    }

        if (input.files && input.
