
<style>
    /* --- THE PRO PITCH --- */
    #pitch {
        width: 90%; height: 80%; position: relative;
        border: 2px solid rgba(255,255,255,0.8);
        transform: rotateX(10deg);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        /* Professional grass stripes */
        background: repeating-linear-gradient(
            0deg,
            #1b5e20,
            #1b5e20 10%,
            #236b28 10%,
            #236b28 20%
        );
    }

    .line { position: absolute; border: 1.5px solid rgba(255,255,255,0.8); pointer-events: none; }
    
    /* Center Markings */
    .halfway { top: 50%; width: 100%; border-bottom: 2px solid rgba(255,255,255,0.8); }
    .center-circle { 
        top: 50%; left: 50%; transform: translate(-50%, -50%); 
        width: 80px; height: 80px; border-radius: 50%; 
    }
    .center-spot {
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 4px; height: 4px; background: white; border-radius: 50%;
    }

    /* Penalty Areas (18-yard box) */
    .penalty-box { left: 20%; width: 60%; height: 16%; }
    .top-box { top: 0; border-top: none; }
    .bottom-box { bottom: 0; border-bottom: none; }

    /* Goal Areas (6-yard box) */
    .goal-area { left: 35%; width: 30%; height: 6%; }
    .top-goal { top: 0; border-top: none; }
    .bottom-goal { bottom: 0; border-bottom: none; }

    /* Penalty Arcs (The "D") */
    .arc { 
        width: 60px; height: 30px; 
        left: 50%; transform: translateX(-50%); 
        border-radius: 0 0 50px 50px; 
    }
    .top-arc { top: 16%; border-top: none; }
    .bottom-arc { 
        bottom: 16%; border-bottom: none; 
        border-radius: 50px 50px 0 0; 
    }

    /* Penalty Spots */
    .penalty-spot {
        left: 50%; transform: translateX(-50%);
        width: 4px; height: 4px; background: white; border-radius: 50%;
    }
    .top-spot { top: 12%; }
    .bottom-spot { bottom: 12%; }

    /* Corner Arcs */
    .corner { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.5); }
    .c-tl { top: -8px; left: -8px; }
    .c-tr { top: -8px; right: -8px; }
    .c-bl { bottom: -8px; left: -8px; }
    .c-br { bottom: -8px; right: -8px; }
</style>

<div id="stage">
    <div id="pitch">
        <div class="line halfway"></div>
        <div class="line center-circle"></div>
        <div class="line center-spot"></div>

        <div class="line penalty-box top-box"></div>
        <div class="line goal-area top-goal"></div>
        <div class="line arc top-arc"></div>
        <div class="line penalty-spot top-spot"></div>

        <div class="line penalty-box bottom-box"></div>
        <div class="line goal-area bottom-goal"></div>
        <div class="line arc bottom-arc"></div>
        <div class="line penalty-spot bottom-spot"></div>

        <div class="line corner c-tl"></div>
        <div class="line corner c-tr"></div>
        <div class="line corner c-bl"></div>
        <div class="line corner c-br"></div>
    </div>
</div>
