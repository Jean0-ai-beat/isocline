<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRENADIERS PRO ELITE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --haiti-blue: #00209F;
            --haiti-red: #D21034;
            --pitch-green: #2e7d32; 
            --pitch-dark: #1b5e20;
            --line-white: rgba(255, 255, 255, 0.9); 
            --accent: #FFD700;
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            margin: 0; background: #050505; color: white; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
            touch-action: none; overscroll-behavior: none;
        }

        /* --- HEADER --- */
        #app-header {
            background: linear-gradient(90deg, var(--haiti-blue) 50%, var(--haiti-red) 50%);
            padding: 12px 15px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 3px solid var(--accent); z-index: 1000;
        }
        #team-crest-box {
            width: 50px; height: 50px; border: 2px solid white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: white; cursor: pointer;
        }
        #team-crest-box img { width: 85%; height: 85%; object-fit: contain; }
        #app-header h1 { margin: 0; font-size: 14px; color: white; flex: 1; text-align: center; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }

        /* --- 3D ARENA --- */
        #stage {
            flex: 1; perspective: 1400px; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden; position: relative;
        }

        #pitch-container {
            position: relative; transform: rotateX(25deg); transform-style: preserve-3d;
            width: 90%; height: 52vh; transition: transform 0.5s ease;
        }

        /* LED BANDEROLS */
        .banderol {
            position: absolute; background: #111; border: 1px solid #444;
            display: flex; align-items: center; overflow: hidden; white-space: nowrap;
        }
        .banderol-content {
            display: inline-block; animation: scroll-ads 15s linear infinite;
            color: var(--accent); font-weight: bold; font-size: 12px;
        }
        .banderol-content span { margin: 0 30px; }

        @keyframes scroll-ads { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .b-top { top: -22px; left: 0; width: 100%; height: 22px; transform: rotateX(-90deg); transform-origin: bottom; }
        .b-left { top: 0; left: -22px; width: 52vh; height: 22px; transform: rotateZ(90deg) rotateX(-90deg); transform-origin: top left; }
        .b-right { top: 0; right: -22px; width: 52vh; height: 22px; transform: rotateZ(-90deg) rotateX(-90deg); transform-origin: top right; }

        #pitch {
            width: 100%; height: 100%; background-color: var(--pitch-green);
            background-image: repeating-linear-gradient(0deg, var(--pitch-green), var(--pitch-green) 10%, var(--pitch-dark) 10%, var(--pitch-dark) 20%);
            position: relative; border: 3px solid var(--line-white);
        }

        .line { position: absolute; border: 1.5px solid var(--line-white); pointer-events: none; }
        .halfway { top: 50%; width: 100%; border-bottom: 2px solid var(--line-white); transform: translateY(-50%); }
        .center-circle { top: 50%; left: 50%; width: 90px; height: 90px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid var(--line-white); }
        .p-box { left: 15%; width: 70%; height: 18%; border: 2px solid var(--line-white); }
        .p-box.top { top: 0; border-top: none; }
        .p-box.bottom { bottom: 0; border-bottom: none; }

        /* --- PLAYER --- */
        .player { 
            position: absolute; width: 65px; text-align: center; 
            z-index: 500; cursor: grab; transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), top 0.4s ease, left 0.4s ease;
            touch-action: none;
        }
        .player.is-dragging { transition: none; transform: scale(1.3) !important; z-index: 1000; }
        .jersey {
            width: 46px; height: 46px; background-color: var(--haiti-blue); border: 2px solid white;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: 900; font-size: 16px; color: white;
            background-size: cover; background-position: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .name-label { 
            font-size: 10px; font-weight: bold; margin-top: 4px; background: rgba(0,0,0,0.8); 
            padding: 2px 6px; border-radius: 3px; white-space: nowrap; border-bottom: 2px solid var(--haiti-red);
        }

        /* --- FOOTER & BENCH --- */
        #footer { background: #000; border-top: 1px solid #333; }
        #bench { 
            width: 94%; height: 85px; margin: 10px auto; border: 1px dashed #444; border-radius: 12px;
            display: flex; align-items: center; gap: 12px; overflow-x: auto; padding: 0 10px;
        }
        #controls { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button, select { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; background: #222; font-size: 11px; }
        .btn-blue { background: var(--haiti-blue); }
        .btn-red { background: var(--haiti-red); }
        .main-btn { grid-column: span 2; background: var(--accent); color: black; font-size: 13px; }

        /* --- MODAL --- */
        #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; }
        #edit-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; padding: 25px; border-radius: 20px; width: 80%; z-index: 2001;
        }
    </style>
</head>
<body>

<div id="app-header">
    <div id="team-crest-box" onclick="document.getElementById('crestIn').click()">
        <img id="crestPrev" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Coat_of_arms_of_Haiti.svg/1200px-Coat_of_arms_of_Haiti.svg.png">
    </div>
    <input type="file" id="crestIn" hidden onchange="loadCrest(this)">
    <h1>HAITI GRENADIERS</h1>
    <button onclick="saveData()" style="background:transparent; border:1px solid white;">SAVE</button>
</div>

<div id="stage">
    <div id="pitch-container">
        <div class="banderol b-top"><div class="banderol-content"><span>GRENADIER ALASO!</span><span>AYITI CHERI</span><span>DIGICEL</span><span>NATCOM</span></div></div>
        <div class="banderol b-left"><div class="banderol-content"><span>L'UNION FAIT LA FORCE</span></div></div>
        <div class="banderol b-right"><div class="banderol-content"><span>LIBERTÉ OU LA MORT</span></div></div>
        <div id="pitch">
            <div class="line halfway"></div>
            <div class="line center-circle"></div>
            <div class="line p-box top"></div>
            <div class="line p-box bottom"></div>
        </div>
    </div>
</div>

<div id="footer">
    <div id="bench"></div>
    <div id="controls">
        <button class="btn-blue" onclick="addNewBenchPlayer()">➕ ADD PLAYER</button>
        <select onchange="changeFormation(this.value)">
            <option value="">FORMATION</option>
            <option value="442">4-4-2</option>
            <option value="433">4-3-3</option>
            <option value="352">3-5-2</option>
        </select>
        <button onclick="loadData()">LOAD LAST</button>
        <button class="btn-red" onclick="location.reload()">RESET</button>
        <button class="main-btn" onclick="exportImage()">📸 EXPORT LINEUP IMAGE</button>
    </div>
</div>

<div id="modal-overlay" onclick="closeModal()"></div>
<div id="edit-modal">
    <h3 style="color:var(--accent)">EDIT PLAYER</h3>
    <input type="text" id="pName" placeholder="Name" style="margin-bottom:10px; width:100%; padding:10px; background:#000; border:1px solid #333; color:white;">
    <input type="number" id="pNum" placeholder="Number" style="margin-bottom:10px; width:100%; padding:10px; background:#000; border:1px solid #333; color:white;">
    <input type="color" id="pColor" style="width:100%; height:40px; margin-bottom:10px;">
    <input type="file" id="pImg" accept="image/*" style="margin-bottom:20px; font-size:10px;">
    <button style="background:var(--haiti-blue); width:100%; padding:15px; color:white; border:none; border-radius:10px;" onclick="applyPlayerChanges()">APPLY</button>
</div>

<script>
    let activePlayer = null, isDragging = false, startX, startY;

    const initialPlayers = [
        {y:88, x:43, n:'J. PLACIDE', num:1, c:'#ffd600'},
        {y:72, x:8, n:'ARCUS', num:2}, {y:75, x:32, n:'ADÉ', num:4}, {y:75, x:53, n:'PIERRE', num:6}, {y:72, x:78, n:'ALEXIS', num:3},
        {y:48, x:20, n:'SABA', num:8}, {y:50, x:43, n:'ALCEUS', num:10}, {y:48, x:66, n:'METUSALA', num:5},
        {y:20, x:15, n:'PIERROT', num:9}, {y:12, x:43, n:'NAZON', num:20}, {y:20, x:72, n:'DEPRÈS', num:11}
    ];

    function createPlayer(data, parent) {
        const p = document.createElement('div');
        p.className = 'player';
        if(parent.id === 'pitch') {
            p.style.top = data.y + '%'; p.style.left = data.x + '%';
        } else {
            p.style.position = 'static'; p.style.transform = 'scale(0.85)';
        }
        p.innerHTML = `<div class="jersey" style="background-color:${data.c || '#00209F'}"><span class="num-txt">${data.num || '?'}</span></div><div class="name-label">${data.n || 'PLAYER'}</div>`;
        p.addEventListener('pointerdown', e => {
            activePlayer = p; isDragging = false; startX = e.clientX; startY = e.clientY;
            p.setPointerCapture(e.pointerId);
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
        });
        parent.appendChild(p);
    }

    function move(e) {
        if (!activePlayer) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            isDragging = true; activePlayer.classList.add('is-dragging');
            activePlayer.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(1.3)`;
        }
    }

    function up(e) {
        if (!activePlayer) return;
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
        if (!isDragging) { openModal(activePlayer); } else {
            const bench = document.getElementById('bench'), pitch = document.getElementById('pitch'), bRect = bench.getBoundingClientRect();
            activePlayer.classList.remove('is-dragging');
            if (e.clientY > bRect.top) {
                bench.appendChild(activePlayer); activePlayer.style.position = 'static'; activePlayer.style.transform = 'scale(0.85)';
            } else {
                pitch.appendChild(activePlayer); activePlayer.style.position = 'absolute';
                const r = pitch.getBoundingClientRect();
                activePlayer.style.left = ((e.clientX - r.left - 32) / r.width * 100) + '%';
                activePlayer.style.top = ((e.clientY - r.top - 32) / r.height * 100) + '%';
                activePlayer.style.transform = 'none';
            }
        }
        activePlayer = null;
    }

    function openModal(el) {
        activePlayer = el;
        document.getElementById('pName').value = el.querySelector('.name-label').innerText;
        document.getElementById('pNum').value = el.querySelector('.num-txt').innerText;
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('edit-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('edit-modal').style.display = 'none';
    }

    function applyPlayerChanges() {
        const j = activePlayer.querySelector('.jersey');
        activePlayer.querySelector('.name-label').innerText = document.getElementById('pName').value;
        j.querySelector('.num-txt').innerText = document.getElementById('pNum').value;
        j.style.backgroundColor = document.getElementById('pColor').value;
        const file = document.getElementById('pImg').files[0];
        if(file) {
            const r = new FileReader(); r.onload = (e) => j.style.backgroundImage = `url(${e.target.result})`; r.readAsDataURL(file);
        }
        closeModal();
    }

    function changeFormation(val) {
        const ps = document.querySelectorAll('.player');
        let c = [];
        if(val==='442') c=[{y:88,x:43},{y:72,x:8},{y:75,x:32},{y:75,x:53},{y:72,x:78},{y:50,x:10},{y:52,x:35},{y:52,x:52},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        if(val==='433') c=[{y:88,x:43},{y:72,x:8},{y:75,x:32},{y:75,x:53},{y:72,x:78},{y:52,x:22},{y:55,x:43},{y:52,x:64},{y:22,x:15},{y:15,x:43},{y:22,x:72}];
        if(val==='352') c=[{y:88,x:43},{y:75,x:22},{y:78,x:43},{y:75,x:64},{y:50,x:10},{y:52,x:28},{y:55,x:43},{y:52,x:58},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        c.forEach((pos, i) => { 
            if(ps[i]) { 
                document.getElementById('pitch').appendChild(ps[i]);
                ps[i].style.position = 'absolute'; ps[i].style.top = pos.y + '%'; ps[i].style.left = pos.x + '%'; ps[i].style.transform = 'none'; 
            } 
        });
    }

    function addNewBenchPlayer() { createPlayer({n: 'SUB', num: 12, c: '#444'}, document.getElementById('bench')); }

    function loadCrest(i) { if (i.files[0]) { const r = new FileReader(); r.onload = (e) => document.getElementById('crestPrev').src = e.target.result; r.readAsDataURL(i.files[0]); } }

    function exportImage() { html2canvas(document.getElementById('stage'), {scale: 2}).then(c => { const l = document.createElement('a'); l.download = 'lineup.png'; l.href = c.toDataURL(); l.click(); }); }

    function saveData() {
        const data = [];
        document.querySelectorAll('.player').forEach(p => {
            data.push({ n: p.querySelector('.name-label').innerText, num: p.querySelector('.num-txt').innerText, c: p.querySelector('.jersey').style.backgroundColor, x: p.style.left, y: p.style.top, onBench: p.parentElement.id === 'bench' });
        });
        localStorage.setItem('haiti_save', JSON.stringify(data));
        alert("Sove!");
    }

    function loadData() {
        const s = localStorage.getItem('haiti_save'); if(!s) return;
        document.getElementById('pitch').innerHTML = '<div class="line halfway"></div><div class="line center-circle"></div><div class="line p-box top"></div><div class="line p-box bottom"></div>';
        document.getElementById('bench').innerHTML = '';
        JSON.parse(s).forEach(d => createPlayer(d, d.onBench ? document.getElementById('bench') : document.getElementById('pitch')));
    }

    window.onload = () => initialPlayers.forEach(p => createPlayer(p, document.getElementById('pitch')));
</script>
</body>
</html>
