<style>
    /* ... (keep your existing root and header styles) ... */
    
    body { 
        touch-action: none; /* Crucial: stops the page from bouncing */
        overscroll-behavior: none;
    }

    .player { 
        position: absolute; width: 60px; text-align: center; 
        z-index: 500;
        /* Soft transition for formation changes and landing */
        transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), top 0.3s ease, left 0.3s ease;
        will-change: transform, top, left;
        cursor: grab;
    }

    /* Professional "Lift" effect when dragging */
    .player.is-dragging {
        transition: none; /* Remove transition while moving for 1:1 feel */
        transform: scale(1.15) !important;
        z-index: 1000;
        filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5));
    }

    .jersey {
        pointer-events: none; /* Ensures touch goes to the player div */
        /* ... existing styles ... */
    }
</style>

<script>
    let activePlayer = null;
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    function createPlayer(data, parent) {
        const p = document.createElement('div');
        p.className = 'player';
        
        if(parent.id === 'pitch') {
            p.style.top = data.y + '%';
            p.style.left = data.x + '%';
        } else {
            p.style.position = 'static';
            p.style.transform = 'scale(0.85)';
        }

        p.innerHTML = `
            <div class="jersey" style="background-color:${data.c || '#d32f2f'}">
                <div class="pattern"></div>
                <span class="num-txt">${data.num || '?'}</span>
            </div>
            <div class="name-label">${data.n || 'NEW PLAYER'}</div>
        `;
        
        // Use unified pointer events for "Softer" response
        p.addEventListener('pointerdown', startDragging);
        parent.appendChild(p);
    }

    function startDragging(e) {
        // Only allow dragging with left mouse or touch
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        
        activePlayer = e.currentTarget;
        isDragging = false; // Reset drag state
        
        const rect = activePlayer.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        
        // Set up the movement tracking
        window.addEventListener('pointermove', moveDragging);
        window.addEventListener('pointerup', stopDragging);
        
        // Visual "Soft Pop"
        activePlayer.setPointerCapture(e.pointerId);
    }

    function moveDragging(e) {
        if (!activePlayer) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        // Threshold to differentiate between a click (edit) and a drag
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            isDragging = true;
            activePlayer.classList.add('is-dragging');
            
            // Move using translate3d for hardware acceleration (smoothness)
            activePlayer.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(1.15)`;
        }
    }

    function stopDragging(e) {
        if (!activePlayer) return;

        window.removeEventListener('pointermove', moveDragging);
        window.removeEventListener('pointerup', stopDragging);

        if (!isDragging) {
            // It was just a tap/click - Open Edit Modal
            openModal(activePlayer);
        } else {
            // It was a drag - Process landing
            const bench = document.getElementById('bench');
            const pitch = document.getElementById('pitch');
            const bRect = bench.getBoundingClientRect();
            
            activePlayer.classList.remove('is-dragging');

            if (e.clientY > bRect.top) {
                // Drop on Bench
                bench.appendChild(activePlayer);
                activePlayer.style.position = 'static';
                activePlayer.style.transform = 'scale(0.85)';
            } else {
                // Drop on Pitch
                pitch.appendChild(activePlayer);
                activePlayer.style.position = 'absolute';
                
                const pRect = pitch.getBoundingClientRect();
                // Smoothly calculate landing percentage
                let newX = ((e.clientX - pRect.left - 30) / pRect.width) * 100;
                let newY = ((e.clientY - pRect.top - 30) / pRect.height) * 100;
                
                activePlayer.style.left = Math.max(0, Math.min(92, newX)) + '%';
                activePlayer.style.top = Math.max(0, Math.min(92, newY)) + '%';
                activePlayer.style.transform = 'none';
            }
        }
        
        activePlayer = null;
    }

    // Formation logic with smooth transitions
    function changeFormation(val) {
        const ps = document.querySelectorAll('.player');
        const pitch = document.getElementById('pitch');
        let c = [];
        if(val==='442') c=[{y:88,x:43},{y:72,x:10},{y:75,x:32},{y:75,x:53},{y:72,x:75},{y:50,x:10},{y:52,x:35},{y:52,x:52},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        if(val==='433') c=[{y:88,x:43},{y:72,x:10},{y:75,x:32},{y:75,x:53},{y:72,x:75},{y:52,x:22},{y:55,x:43},{y:52,x:64},{y:22,x:15},{y:15,x:43},{y:22,x:72}];
        if(val==='352') c=[{y:88,x:43},{y:75,x:22},{y:78,x:43},{y:75,x:64},{y:50,x:10},{y:52,x:28},{y:55,x:43},{y:52,x:58},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        
        c.forEach((pos, i) => {
            if(ps[i]) {
                pitch.appendChild(ps[i]);
                ps[i].style.position = 'absolute';
                // Trigger the CSS transition
                setTimeout(() => {
                    ps[i].style.top = pos.y + '%';
                    ps[i].style.left = pos.x + '%';
                    ps[i].style.transform = 'none';
                }, 10);
            }
        });
    }

    /* ... (Keep the rest of your helper functions like openModal, saveData, loadData) ... */
</script>
