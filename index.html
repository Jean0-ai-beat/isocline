<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOCLINEUP JPTECH ULTIMATE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --pitch-green: #388e3c; 
            --pitch-dark: #2e7d32;
            --line-white: rgba(255, 255, 255, 0.6); 
            --accent: #00e676;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; background: #000; color: white; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }

        /* --- HEADER & LOGO --- */
        #app-header {
            background: #111; padding: 10px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #333; z-index: 10;
        }
        #team-crest-box {
            width: 45px; height: 45px; border: 1px dashed #555; border-radius: 5px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: #222; cursor: pointer; position: relative;
        }
        #team-crest-box img { width: 100%; height: 100%; object-fit: contain; position: absolute; top:0; left:0; }
        #app-header h1 { margin: 0; font-size: 14px; color: var(--accent); flex: 1; text-align: center; letter-spacing: 1px; }

        /* --- 3D STAGE --- */
        #stage {
            flex: 1; perspective: 1200px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden;
        }

        #pitch {
            width: 92%; height: 58vh;
            background-color: var(--pitch-green);
            background-image: repeating-linear-gradient(0deg, var(--pitch-green), var(--pitch-green) 10%, var(--pitch-dark) 10%, var(--pitch-dark) 20%);
            position: relative; border: 3px solid var(--line-white);
            transform: rotateX(20deg); box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .line { position: absolute; border: 1.5px solid var(--line-white); pointer-events: none; }
        .halfway { top: 50%; width: 100%; border-bottom: 2px solid var(--line-white); }
        .penalty-box { left: 15%; width: 70%; height: 15%; }
        .penalty-box.top { top: 0; border-top: none; }
        .penalty-box.bottom { bottom: 0; border-bottom: none; }

        /* --- PLAYERS --- */
        .player { position: absolute; width: 55px; text-align: center; touch-action: none; cursor: grab; z-index: 20; transition: transform 0.1s; }
        .jersey {
            width: 44px; height: 44px; background-color: #d32f2f; border: 2px solid white;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; font-size: 15px;
            box-shadow: 0 4px 0px rgba(0,0,0,0.4);
            background-size: cover; background-position: center; overflow: hidden; position: relative;
        }
        
        /* Patterns */
        .pattern-overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; }
        .striped { background-image: linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.2) 50%); background-size: 12px 100%; }
        .hooped { background-image: linear-gradient(0deg, transparent 50%, rgba(0,0,0,0.2) 50%); background-size: 100% 12px; }

        .name-label { font-size: 9px; font-weight: bold; margin-top: 4px; background: rgba(0,0,0,0.85); padding: 2px 5px; border-radius: 3px; white-space: nowrap; }

        /* --- BENCH --- */
        #bench-container { background: #111; border-top: 1px solid #333; padding: 10px 0; text-align: center; }
        #bench-title { font-size: 9px; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        #bench { width: 95%; height: 70px; border: 2px dashed #333; border-radius: 10px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 5px; overflow-x: auto; }

        /* --- CONTROLS --- */
        #controls { padding: 10px; background: #000; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        button, select { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; background: #222; font-size: 10px; }
        .save-btn { background: var(--accent); color: black; grid-column: span 3; padding: 15px; margin-top: 5px; font-size: 12px; }

        /* --- MODAL --- */
        #editModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #444; z-index: 100; width: 85%; box-sizing: border-box;
        }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; background: #222; color: white; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="app-header">
    <div id="team-crest-box" onclick="document.getElementById('crestInput').click()">
        <span id="crestText" style="font-size: 9px;">LOGO</span>
        <img id="crestImg" src="" style="display:none;">
    </div>
    <input type="file" id="crestInput" hidden accept="image/*" onchange="uploadCrest(this)">
    <h1>SOCLINEUP JPTECH</h1>
    <button onclick="saveRoster()">SAVE</button>
</div>

<div id="stage">
    <div id="pitch">
        <div class="line halfway"></div>
        <div class="line penalty-box top"></div>
        <div class="line penalty-box bottom"></div>
    </div>
</div>

<div id="bench-container">
    <div id="bench-title">Substitutes Bench (Drag to Swap)</div>
    <div id="bench"></div>
</div>

<div id="controls">
    <select id="formationSelect" onchange="applyFormation(this.value)">
        <option value="">FORMATION</option>
        <option value="442">4-4-2</option>
        <option value="433">4-3-3</option>
        <option value="352">3-5-2</option>
    </select>
    <button onclick="loadRoster()">LOAD</button>
    <button onclick="location.reload()">RESET</button>
    <button class="save-btn" onclick="downloadLineup()">📸 SAVE TO GALLERY</button>
</div>

<div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
<div id="editModal">
    <h3 style="margin-top:0">Player Details</h3>
    <input type="text" id="editName" placeholder="Name">
    <input type="number" id="editNum" placeholder="Number">
    <label style="font-size:11px">Color & Pattern:</label>
    <div style="display:flex; gap:5px;">
        <input type="color" id="editColor" value="#d32f2f" style="width:50px">
        <select id="editPattern">
            <option value="none">Solid</option>
            <option value="striped">Striped</option>
            <option value="hooped">Hooped</option>
        </select>
    </div>
    <label style="font-size:11px">Player Photo / Custom Jersey:</label>
    <input type="file" id="editImg" accept="image/*">
    <div style="display:flex; gap:10px; margin-top:15px;">
        <button style="background:#28a745; flex:1" onclick="saveChanges()">APPLY</button>
        <button style="background:#444; flex:1" onclick="closeModal()">CANCEL</button>
    </div>
</div>

<script>
    let currentPlayer = null;
    const defaultData = [
        { y: 88, x: 43, n: 'GK', num: 1, c: '#ffd600' },
        { y: 72, x: 10 }, { y: 75, x: 32 }, { y: 75, x: 53 }, { y: 72, x: 75 },
        { y: 50, x: 20 }, { y: 52, x: 43 }, { y: 50, x: 65 },
        { y: 22, x: 15 }, { y: 15, x: 42 }, { y: 22, x: 70 }
    ];

    function init() {
        const pitch = document.getElementById('pitch');
        defaultData.forEach((p, i) => {
            createPlayer(p.y, p.x, p.n || 'PLAYER', p.num || i+1, p.c || '#d32f2f', pitch);
        });
    }

    function createPlayer(y, x, name, num, color, parent) {
        const div = document.createElement('div');
        div.className = 'player';
        div.style.top = y + '%';
        div.style.left = x + '%';
        div.innerHTML = `
            <div class="jersey" style="background-color:${color}">
                <div class="pattern-overlay"></div>
                <span class="num-text">${num}</span>
            </div>
            <div class="name-label">${name}</div>`;
        
        div.addEventListener('click', (e) => {
            if(!div.dataset.dragging) openModal(div);
        });

        makeDraggable(div);
        parent.appendChild(div);
    }

    function makeDraggable(el) {
        let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        
        const dragStart = (e) => {
            const t = e.type === "touchstart" ? e.touches[0] : e;
            initialX = t.clientX - xOffset; 
            initialY = t.clientY - yOffset;
            if (e.target.closest('.player')) { active = true; el.dataset.dragging = "true"; }
        };

        const dragMove = (e) => {
            if (active) {
                e.preventDefault();
                const t = e.type === "touchmove" ? e.touches[0] : e;
                currentX = t.clientX - initialX; 
                currentY = t.clientY - initialY;
                xOffset = currentX; yOffset = currentY;
                el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        };

        const dragEnd = (e) => {
            if(!active) return;
            active = false;
            setTimeout(() => delete el.dataset.dragging, 100);

            const bench = document.getElementById('bench');
            const rect = bench.getBoundingClientRect();
            const t = (e.type === "touchend") ? e.changedTouches[0] : e;
            
            if (t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                bench.appendChild(el);
                el.style.position = "static";
                el.style.transform = "scale(0.85)";
                xOffset = 0; yOffset = 0;
            } else {
                document.getElementById('pitch').appendChild(el);
                el.style.position = "absolute";
                el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        };

        el.addEventListener('touchstart', dragStart, {passive: false});
        el.addEventListener('touchmove', dragMove, {passive: false});
        el.addEventListener('touchend', dragEnd);
        el.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);
    }

    function openModal(el) {
        currentPlayer = el;
        document.getElementById('editName').value = el.querySelector('.name-label').innerText;
        document.getElementById('editNum').value = el.querySelector('.num-text').innerText;
        document.getElementById('editModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function saveChanges() {
        const jersey = currentPlayer.querySelector('.jersey');
        const patternOverlay = jersey.querySelector('.pattern-overlay');
        
        currentPlayer.querySelector('.name-label').innerText = document.getElementById('editName').value;
        jersey.querySelector('.num-text').innerText = document.getElementById('editNum').value;
        jersey.style.backgroundColor = document.getElementById('editColor').value;
        
        const pattern = document.getElementById('editPattern').value;
        patternOverlay.className = 'pattern-overlay ' + (pattern !== 'none' ? pattern : '');

        const file = document.getElementById('editImg').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => jersey.style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(file);
        }
        closeModal();
    }

    function applyFormation(val) {
        const players = document.querySelectorAll('.player');
        const pitch = document.getElementById('pitch');
        let coords = [];
        if(val === '442') coords = [{y:88,x:43}, {y:72,x:10}, {y:75,x:32}, {y:75,x:53}, {y:72,x:75}, {y:50,x:10}, {y:52,x:35}, {y:52,x:52}, {y:50,x:78}, {y:22,x:33}, {y:22,x:54}];
        if(val === '433') coords = [{y:88,x:43}, {y:72,x:10}, {y:75,x:32}, {y:75,x:53}, {y:72,x:75}, {y:52,x:22}, {y:55,x:43}, {y:52,x:64}, {y:22,x:15}, {y:15,x:43}, {y:22,x:72}];
        if(val === '352') coords = [{y:88,x:43}, {y:75,x:22}, {y:78,x:43}, {y:75,x:64}, {y:50,x:10}, {y:52,x:28}, {y:55,x:43}, {y:52,x:58}, {y:50,x:78}, {y:22,x:33}, {y:22,x:54}];
        
        coords.forEach((c, i) => {
            if(players[i]) {
                pitch.appendChild(players[i]);
                players[i].style.position = "absolute";
                players[i].style.top = c.y + '%';
                players[i].style.left = c.x + '%';
                players[i].style.transform = 'translate3d(0,0,0)';
            }
        });
    }

    function uploadCrest(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('crestImg').src = e.target.result;
                document.getElementById('crestImg').style.display = 'block';
                document.getElementById('crestText').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function saveRoster() {
        const data = [];
        document.querySelectorAll('.player').forEach(p => {
            data.push({
                name: p.querySelector('.name-label').innerText,
                num: p.querySelector('.num-text').innerText,
                color: p.querySelector('.jersey').style.backgroundColor,
                x: p.style.left, y: p.style.top,
                inBench: p.parentElement.id === 'bench',
                img: p.querySelector('.jersey').style.backgroundImage
            });
        });
        localStorage.setItem('jptech_save_slot', JSON.stringify(data));
        alert("Lineup saved successfully!");
    }

    function loadRoster() {
        const raw = localStorage.getItem('jptech_save_slot');
        if(!raw) return alert("No saved data found.");
        const data = JSON.parse(raw);
        document.getElementById('pitch').innerHTML = '<div class="line halfway"></div><div class="line penalty-box top"></div><div class="line penalty-box bottom"></div>';
        document.getElementById('bench').innerHTML = '';
        data.forEach(p => {
            const parent = p.inBench ? document.getElementById('bench') : document.getElementById('pitch');
            createPlayer(p.y.replace('%',''), p.x.replace('%',''), p.name, p.num, p.color, parent);
            if(p.inBench) {
                const last = parent.lastChild;
                last.style.position = "static";
                last.style.transform = "scale(0.85)";
            }
        });
    }

    function downloadLineup() {
        const stage = document.getElementById('stage');
        html2canvas(stage, { backgroundColor: '#000', useCORS: true, scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'jptech_lineup.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    window.onload = init;
</script>
</body>
</html>
