<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOCLINEUP JPTECH PERFECT DRAG</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --pitch-green: #388e3c; 
            --pitch-dark: #2e7d32;
            --line-white: rgba(255, 255, 255, 0.8); 
            --accent: #00e676;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; background: #000; color: white; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
            touch-action: none; /* Prevents page bounce on mobile */
        }

        /* --- HEADER --- */
        #app-header {
            background: #111; padding: 10px 15px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #333; z-index: 2000;
        }
        #team-crest-box {
            width: 45px; height: 45px; border: 2px dashed #444; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: #1a1a1a; cursor: pointer;
        }
        #team-crest-box img { width: 100%; height: 100%; object-fit: contain; }
        #app-header h1 { margin: 0; font-size: 14px; color: var(--accent); flex: 1; text-align: center; text-transform: uppercase; }

        /* --- 3D STAGE --- */
        #stage {
            flex: 1; perspective: 1500px; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #222 0%, #000 100%);
            overflow: hidden; position: relative;
        }

        #pitch {
            width: 92%; height: 50vh;
            background-color: var(--pitch-green);
            background-image: repeating-linear-gradient(0deg, var(--pitch-green), var(--pitch-green) 10%, var(--pitch-dark) 10%, var(--pitch-dark) 20%);
            position: relative; border: 3px solid var(--line-white);
            transform: rotateX(25deg); transform-style: preserve-3d;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        /* Markings */
        .line { position: absolute; border: 1.5px solid var(--line-white); pointer-events: none; }
        .halfway { top: 50%; width: 100%; border-bottom: 2px solid var(--line-white); transform: translateY(-50%); }
        .center-circle { top: 50%; left: 50%; width: 90px; height: 90px; border: 2px solid var(--line-white); border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box { left: 15%; width: 70%; height: 18%; border: 2px solid var(--line-white); }
        .penalty-box.top { top: 0; border-top: none; }
        .penalty-box.bottom { bottom: 0; border-bottom: none; }

        /* --- PLAYERS --- */
        .player { 
            position: absolute; width: 60px; text-align: center; 
            cursor: grab; z-index: 500; transition: transform 0.1s ease-out;
        }
        .player.dragging { cursor: grabbing; z-index: 3000; transition: none; pointer-events: none; }
        
        .jersey {
            width: 45px; height: 45px; background-color: #d32f2f; border: 2px solid #fff;
            border-radius: 50%; margin: 0 auto; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; font-size: 16px;
            background-size: cover; background-position: center; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
        }
        .pattern { position: absolute; width: 100%; height: 100%; border-radius: 50%; opacity: 0.3; }
        .striped { background: repeating-linear-gradient(90deg, #000, #000 10px, transparent 10px, transparent 20px); }
        .hooped { background: repeating-linear-gradient(0deg, #000, #000 10px, transparent 10px, transparent 20px); }
        .name-label { font-size: 10px; font-weight: bold; margin-top: 5px; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 3px; white-space: nowrap; pointer-events: none; }

        /* --- BENCH --- */
        #bench-area { background: #111; padding: 10px 0; border-top: 1px solid #333; z-index: 2000; }
        #bench { 
            width: 92%; height: 80px; margin: 0 auto; border: 2px dashed #444; border-radius: 12px;
            display: flex; align-items: center; gap: 10px; overflow-x: auto; padding: 0 10px;
            background: rgba(255,255,255,0.03);
        }
        .bench-slot { flex: 0 0 60px; height: 75px; display: flex; align-items: center; justify-content: center; }

        /* --- CONTROLS --- */
        #controls { padding: 12px; background: #000; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; z-index: 2000; }
        button, select { padding: 12px; border: none; border-radius: 6px; font-weight: bold; color: white; background: #222; font-size: 11px; }
        .add-btn { background: #222; color: var(--accent); border: 1px solid var(--accent); }
        .export-btn { background: var(--accent); color: #000; grid-column: span 2; font-size: 13px; margin-top: 5px; }

        /* --- MODAL --- */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; }
        #edit-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; padding: 20px; border-radius: 15px; width: 85%; z-index: 5001; border: 1px solid #333;
        }
    </style>
</head>
<body>

<div id="app-header">
    <div id="team-crest-box" onclick="document.getElementById('crestIn').click()">
        <span id="crestStatus" style="font-size:9px">LOGO</span>
        <img id="crestPrev" src="" style="display:none">
    </div>
    <input type="file" id="crestIn" hidden accept="image/*" onchange="loadCrest(this)">
    <h1>SOCLINEUP PRO</h1>
    <button onclick="saveData()">SAVE</button>
</div>

<div id="stage">
    <div id="pitch">
        <div class="line halfway"></div>
        <div class="line center-circle"></div>
        <div class="line penalty-box top"></div>
        <div class="line penalty-box bottom"></div>
    </div>
</div>

<div id="bench-area">
    <div id="bench"></div>
</div>

<div id="controls">
    <button class="add-btn" onclick="addNewPlayer()">➕ ADD PLAYER</button>
    <select onchange="changeFormation(this.value)">
        <option value="">FORMATION</option>
        <option value="442">4-4-2</option>
        <option value="433">4-3-3</option>
        <option value="352">3-5-2</option>
    </select>
    <button onclick="loadData()">LOAD</button>
    <button onclick="location.reload()">RESET</button>
    <button class="export-btn" onclick="exportImage()">📸 EXPORT LINEUP IMAGE</button>
</div>

<div id="modal-overlay" onclick="closeModal()"></div>
<div id="edit-modal">
    <h3 style="margin:0 0 15px 0; color:var(--accent)">Edit Player</h3>
    <div style="margin-bottom:10px;"><label style="font-size:10px; color:#888">Name</label><input type="text" id="pName" style="width:100%; padding:10px; background:#222; border:1px solid #444; color:white; border-radius:5px;"></div>
    <div style="margin-bottom:10px;"><label style="font-size:10px; color:#888">Number</label><input type="number" id="pNum" style="width:100%; padding:10px; background:#222; border:1px solid #444; color:white; border-radius:5px;"></div>
    <div style="margin-bottom:10px;">
        <label style="font-size:10px; color:#888">Jersey</label>
        <div style="display:flex; gap:5px;">
            <input type="color" id="pColor" style="flex:1; height:40px; border:none; background:none;">
            <select id="pPattern" style="flex:2;">
                <option value="">Solid</option>
                <option value="striped">Striped</option>
                <option value="hooped">Hooped</option>
            </select>
        </div>
    </div>
    <div style="margin-bottom:20px;"><label style="font-size:10px; color:#888">Photo</label><input type="file" id="pImg" accept="image/*" style="width:100%; color:#888; font-size:11px;"></div>
    <div style="display:flex; gap:10px;">
        <button style="background:var(--accent); color:black; flex:2; padding:15px; border-radius:8px; font-weight:bold" onclick="applyPlayerChanges()">SAVE CHANGES</button>
        <button style="background:#333; flex:1; border-radius:8px" onclick="closeModal()">CANCEL</button>
    </div>
</div>

<script>
    let activePlayer = null;
    let dragEl = null;
    let isMoving = false;
    let startX, startY, origX, origY;

    // --- PLAYER CREATION ---
    function createPlayer(data, parentId = 'pitch') {
        const p = document.createElement('div');
        p.className = 'player';
        if(parentId === 'pitch') {
            p.style.top = data.y + '%';
            p.style.left = data.x + '%';
        }
        
        p.innerHTML = `
            <div class="jersey" style="background-color:${data.c || '#d32f2f'}">
                <div class="pattern"></div>
                <span class="num-txt">${data.num || '1'}</span>
            </div>
            <div class="name-label">${data.n || 'PLAYER'}</div>
        `;

        p.addEventListener('touchstart', dragStart, {passive: false});
        p.addEventListener('mousedown', dragStart);
        
        if(parentId === 'bench') {
            const slot = document.createElement('div');
            slot.className = 'bench-slot';
            slot.appendChild(p);
            document.getElementById('bench').appendChild(slot);
            p.style.position = 'static';
            p.style.transform = 'scale(0.85)';
        } else {
            document.getElementById('pitch').appendChild(p);
        }
    }

    // --- NEW DRAG ENGINE ---
    function dragStart(e) {
        if (e.target.closest('.player')) {
            dragEl = e.target.closest('.player');
            isMoving = false;
            const touch = e.type === 'touchstart' ? e.touches[0] : e;
            startX = touch.clientX;
            startY = touch.clientY;
            
            // Get original screen position for "ghost" movement
            const rect = dragEl.getBoundingClientRect();
            origX = touch.clientX - rect.left;
            origY = touch.clientY - rect.top;

            window.addEventListener('touchmove', dragMove, {passive: false});
            window.addEventListener('mousemove', dragMove);
            window.addEventListener('touchend', dragEnd);
            window.addEventListener('mouseup', dragEnd);
        }
    }

    function dragMove(e) {
        if (!dragEl) return;
        const touch = e.type === 'touchmove' ? e.touches[0] : e;
        
        // Detect if it's a drag or just a tap
        if (Math.abs(touch.clientX - startX) > 5 || Math.abs(touch.clientY - startY) > 5) {
            isMoving = true;
            e.preventDefault();
            
            // Move player relative to screen
            dragEl.classList.add('dragging');
            dragEl.style.position = 'fixed';
            dragEl.style.left = (touch.clientX - origX) + 'px';
            dragEl.style.top = (touch.clientY - origY) + 'px';
            dragEl.style.transform = 'scale(1.1) rotate(5deg)';
        }
    }

    function dragEnd(e) {
        if (!dragEl) return;
        
        const touch = e.type === 'touchend' ? e.changedTouches[0] : e;
        const bench = document.getElementById('bench');
        const pitch = document.getElementById('pitch');
        const bRect = bench.getBoundingClientRect();
        const pRect = pitch.getBoundingClientRect();

        window.removeEventListener('touchmove', dragMove);
        window.removeEventListener('mousemove', dragMove);

        if (!isMoving) {
            openModal(dragEl); // Just a tap
        } else {
            // Check if dropped on Bench
            if (touch.clientY > bRect.top) {
                const slot = document.createElement('div');
                slot.className = 'bench-slot';
                bench.appendChild(slot);
                slot.appendChild(dragEl);
                dragEl.style.position = 'static';
                dragEl.style.transform = 'scale(0.85)';
            } else {
                // Landed on Pitch
                pitch.appendChild(dragEl);
                dragEl.style.position = 'absolute';
                // Calculate percentage based on pitch box
                let xPercent = ((touch.clientX - pRect.left - 30) / pRect.width) * 100;
                let yPercent = ((touch.clientY - pRect.top - 30) / pRect.height) * 100;
                
                dragEl.style.left = Math.max(0, Math.min(90, xPercent)) + '%';
                dragEl.style.top = Math.max(0, Math.min(90, yPercent)) + '%';
                dragEl.style.transform = 'none';
            }
        }

        dragEl.classList.remove('dragging');
        dragEl = null;
    }

    // --- MODAL & DATA ---
    function openModal(el) {
        activePlayer = el;
        document.getElementById('pName').value = el.querySelector('.name-label').innerText;
        document.getElementById('pNum').value = el.querySelector('.num-txt').innerText;
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('edit-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('edit-modal').style.display = 'none';
    }

    function applyPlayerChanges() {
        const jersey = activePlayer.querySelector('.jersey');
        activePlayer.querySelector('.name-label').innerText = document.getElementById('pName').value;
        jersey.querySelector('.num-txt').innerText = document.getElementById('pNum').value;
        jersey.style.backgroundColor = document.getElementById('pColor').value;
        jersey.querySelector('.pattern').className = 'pattern ' + document.getElementById('pPattern').value;
        
        const file = document.getElementById('pImg').files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = (e) => jersey.style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(file);
        }
        closeModal();
    }

    function addNewPlayer() { createPlayer({n:'SUB', num:'12', c:'#444'}, 'bench'); }

    function changeFormation(val) {
        const ps = document.querySelectorAll('.player');
        const pitch = document.getElementById('pitch');
        let c = [];
        if(val==='442') c=[{y:88,x:43},{y:72,x:10},{y:75,x:32},{y:75,x:53},{y:72,x:75},{y:50,x:10},{y:52,x:35},{y:52,x:52},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        if(val==='433') c=[{y:88,x:43},{y:72,x:10},{y:75,x:32},{y:75,x:53},{y:72,x:75},{y:52,x:22},{y:55,x:43},{y:52,x:64},{y:22,x:15},{y:15,x:43},{y:22,x:72}];
        if(val==='352') c=[{y:88,x:43},{y:75,x:22},{y:78,x:43},{y:75,x:64},{y:50,x:10},{y:52,x:28},{y:55,x:43},{y:52,x:58},{y:50,x:78},{y:22,x:33},{y:22,x:54}];
        
        c.forEach((pos, i) => {
            if(ps[i]) {
                pitch.appendChild(ps[i]);
                ps[i].style.position = 'absolute';
                ps[i].style.top = pos.y + '%';
                ps[i].style.left = pos.x + '%';
                ps[i].style.transform = 'none';
            }
        });
    }

    function exportImage() {
        html2canvas(document.getElementById('stage'), {scale: 2}).then(canvas => {
            const link = document.createElement('a');
            link.download = 'lineup.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function saveData() {
        const players = [];
        document.querySelectorAll('.player').forEach(p => {
            players.push({
                n: p.querySelector('.name-label').innerText,
                num: p.querySelector('.num-txt').innerText,
                c: p.querySelector('.jersey').style.backgroundColor,
                x: p.style.left, y: p.style.top,
                onBench: p.parentElement.classList.contains('bench-slot')
            });
        });
        localStorage.setItem('jp_pro_save', JSON.stringify(players));
        alert("Saved!");
    }

    function loadData() {
        const saved = localStorage.getItem('jp_pro_save');
        if(!saved) return;
        const data = JSON.parse(saved);
        document.getElementById('pitch').innerHTML = '<div class="line halfway"></div><div class="line center-circle"></div><div class="line penalty-box top"></div><div class="line penalty-box bottom"></div>';
        document.getElementById('bench').innerHTML = '';
        data.forEach(d => createPlayer(d, d.onBench ? 'bench' : 'pitch'));
    }

    window.onload = () => {
        const starters = [
            {y:88, x:43, n:'GK', num:1, c:'#ffd600'},
            {y:72, x:10}, {y:75, x:32}, {y:75, x:53}, {y:72, x:75},
            {y:48, x:22}, {y:50, x:43}, {y:48, x:64},
            {y:20, x:15}, {y:12, x:43}, {y:20, x:72}
        ];
        starters.forEach(s => createPlayer(s));
    };
</script>
</body>
</html>
